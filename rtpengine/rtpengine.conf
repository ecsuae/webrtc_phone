[rtpengine]
# Main control socket kamailio will talk to
# Bind to container interface and advertise public IP for external leg
interface = eth0!38.242.157.239
foreground = true
log-stderr = true
listen-ng = 127.0.0.1:2223

# Port range for RTP media
port-min = 30000
port-max = 31000

# Logging
log-level = 7

# Recording settings
recording-dir = /tmp
recording-method = pcap
recording-format = eth

# Delete delay
delete-delay = 0

# HTTP listen
listen-http = 38.242.157.239:8080
