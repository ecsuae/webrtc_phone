services:
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./certs:/certs:ro
    command: >
      -n
      --realm=testfusn.srve.cc
      --server-name=testfusn.srve.cc
      --fingerprint
      --lt-cred-mech
      --user=turnuser:turnpass
      --listening-ip=38.242.157.239
      --relay-ip=38.242.157.239
      --listening-port=3478
      --tls-listening-port=5349
      --cert=/certs/fullchain.pem
      --pkey=/certs/privkey.pem
      --min-port=49160
      --max-port=49200
      --no-multicast-peers
      --no-cli
      --log-file=stdout

  rtpengine:
    image: davehorton/rtpengine:latest
    container_name: rtpengine
    restart: "no"
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    privileged: true
    command:
      - rtpengine
      - --foreground
      - --log-stderr
      - --log-level=7
      - --listen-ng=127.0.0.1:2223
      - --interface=eth0!38.242.157.239
      - --port-min=30000
      - --port-max=31000

  kamailio:
    image: ghcr.io/kamailio/kamailio:5.8.2-jammy
    container_name: kamailio
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - PBX_IP=${PBX_IP}
      - PBX_PORT=${PBX_PORT}
      - PBX_TRANSPORT=udp
      - KAM_PUBLIC_IP=${PUBLIC_IP}
    depends_on:
      - rtpengine
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/local.cfg:/etc/kamailio/local.cfg:ro
      - ./kamailio/tls.cfg:/etc/kamailio/tls.cfg:ro
      - ./certs:/certs:ro

  push-server:
    build: ./push-server
    container_name: push-server
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - PORT=3001

  nginx:
    image: nginx:alpine
    container_name: phone-nginx
    restart: unless-stopped
    network_mode: host
    depends_on:
      - kamailio
      - push-server
    volumes:
      - ./nginx/phone.srve.cc.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/var/www/phone:ro
      - ./certs:/certs:ro