services:
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Asia/Karachi
    volumes:
      - ./certs:/certs:ro
    command: >
      -n
      --realm=${DOMAIN}
      --server-name=${DOMAIN}
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USER}:${TURN_PASS}
      --listening-ip=${PUBLIC_IP}
      --relay-ip=${TURN_RELAY_IP}
      --listening-port=${TURN_PORT}
      --tls-listening-port=${TURN_TLS_PORT}
      --cert=/certs/fullchain.pem
      --pkey=/certs/privkey.pem
      --min-port=${TURN_MIN_PORT}
      --max-port=${TURN_MAX_PORT}
      --no-multicast-peers
      --no-cli
      --log-file=stdout
      --verbose

  rtpengine:
    image: davehorton/rtpengine:latest
    container_name: rtpengine
    restart: "no"
    network_mode: host
    environment:
      - TZ=Asia/Karachi
    volumes:
      - ./rtpengine/rtpengine.conf:/config/rtpengine.conf:ro
      - ./rtpengine/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
    entrypoint:
      - /bin/sh
      - /entrypoint-wrapper.sh
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    privileged: true
    command:
      - rtpengine
      - --config-file=/etc/rtpengine.conf
      - --foreground
      - --log-stderr
      - --log-level=6

  kamailio:
    image: ghcr.io/kamailio/kamailio:5.8.2-jammy
    container_name: kamailio
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - TZ=Asia/Karachi
      - PBX_TRANSPORT=udp
      - KAM_PUBLIC_IP=${PUBLIC_IP}
      - KAMAILIO_IP=${PUBLIC_IP}
    depends_on:
      - rtpengine
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/local.cfg:/etc/kamailio/local.cfg:ro
      - ./kamailio/tls.cfg:/etc/kamailio/tls.cfg:ro
      - ./kamailio/routes:/etc/kamailio/routes:ro
      - ./certs:/certs:ro

  push-server:
    build: ./push-server
    container_name: push-server
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - TZ=Asia/Karachi
      - PORT=${PUSH_SERVER_PORT}
      - ADMIN_BIND_HOST=${ADMIN_BIND_HOST}
      - ADMIN_BIND_PORT=${ADMIN_BIND_PORT}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./backups/mobile-logs:/app/../backups/mobile-logs
      - ./data/push-server/provisioning:/app/data/provisioning
      - ./routing-config.json:/app/routing-config.json

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    env_file:
      - .env
    volumes:
      - ./docker/wireguard/start.sh:/start.sh:ro
      - wireguard_config:/config
    entrypoint: ["/bin/sh", "/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wg show >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    build: ./nginx
    container_name: phone-nginx
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - TZ=Asia/Karachi
    depends_on:
      - kamailio
      - push-server
    entrypoint:
      - /bin/sh
      - /entrypoint-wrapper.sh
    volumes:
      - ./nginx/site.conf.template:/config/site.conf.template:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
      - ./www:/var/www/phone:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/reload:/var/run/certbot-reload

  certbot-init:
    image: certbot/certbot:latest
    container_name: certbot-init
    env_file: .env
    depends_on:
      - nginx
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/reload:/var/run/certbot-reload
      - ./docker/certbot/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  certbot-renew:
    image: certbot/certbot:latest
    container_name: certbot-renew
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/reload:/var/run/certbot-reload
      - ./docker/certbot/renew.sh:/renew.sh:ro
    entrypoint: ["/bin/sh", "/renew.sh"]

volumes:
  wireguard_config:
