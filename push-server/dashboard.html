<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Device Debug Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #2d3748;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .header p {
      color: #718096;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .stat-card .label {
      font-size: 12px;
      text-transform: uppercase;
      color: #a0aec0;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
      color: #2d3748;
    }

    .devices-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .devices-header {
      padding: 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .devices-header h2 {
      font-size: 20px;
    }

    .refresh-btn {
      background: #4299e1;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .refresh-btn:hover {
      background: #3182ce;
    }

    .device-list {
      max-height: 600px;
      overflow-y: auto;
    }

    .device-item {
      padding: 20px;
      border-bottom: 1px solid #e2e8f0;
      transition: background 0.2s;
    }

    .device-item:hover {
      background: #f7fafc;
    }

    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .device-id {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #4a5568;
      font-weight: 600;
    }

    .device-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-ios {
      background: #e6fffa;
      color: #047857;
    }

    .badge-android {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-debug {
      background: #fee2e2;
      color: #991b1b;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .badge-offline {
      background: #f3f4f6;
      color: #6b7280;
    }

    .device-info {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-item .label {
      font-size: 11px;
      text-transform: uppercase;
      color: #a0aec0;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .info-item .value {
      color: #2d3748;
      word-break: break-all;
    }

    .username-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .username-tag {
      background: #e0e7ff;
      color: #3730a3;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }

    .comment-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #e2e8f0;
    }

    .comment-form {
      display: flex;
      gap: 8px;
    }

    .comment-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 14px;
    }

    .comment-btn {
      background: #48bb78;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .comment-btn:hover {
      background: #38a169;
    }

    .comment-display {
      background: #fffbeb;
      border-left: 3px solid #fbbf24;
      padding: 12px;
      border-radius: 4px;
      font-size: 14px;
      color: #78350f;
      margin-bottom: 8px;
    }

    .view-logs-btn {
      background: #805ad5;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 12px;
    }

    .view-logs-btn:hover {
      background: #6b46c1;
    }

    .view-logs-btn:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #a0aec0;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #a0aec0;
    }

    .empty i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-mobile-alt"></i> Mobile Device Debug Dashboard</h1>
      <p>Track and debug mobile WebRTC clients</p>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Total Devices</div>
        <div class="value" id="totalDevices">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Debug Mode Active</div>
        <div class="value" id="debugActive">-</div>
      </div>
      <div class="stat-card">
        <div class="label">iOS Devices</div>
        <div class="value" id="iosCount">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Android Devices</div>
        <div class="value" id="androidCount">-</div>
      </div>
    </div>

    <div class="devices-container">
      <div class="devices-header">
        <h2>Devices</h2>
        <button class="refresh-btn" onclick="loadDevices()">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
      </div>
      <div class="device-list" id="deviceList">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i> Loading devices...
        </div>
      </div>
    </div>
  </div>

  <script>
    // Load devices from API
    async function loadDevices() {
      const listEl = document.getElementById('deviceList');
      listEl.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading devices...</div>';

      try {
        const response = await fetch('/api/logs/mobile');
        const data = await response.json();

        updateStats(data);
        renderDevices(data.devices);
      } catch (err) {
        listEl.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>Failed to load devices</p></div>`;
        console.error('Failed to load devices:', err);
      }
    }

    // Update statistics
    function updateStats(data) {
      const devices = data.devices || [];
      document.getElementById('totalDevices').textContent = devices.length;

      const debugActive = devices.filter(d => d.metadata?.debugMode).length;
      document.getElementById('debugActive').textContent = debugActive;

      const iosCount = devices.filter(d => d.metadata?.deviceType === 'iOS').length;
      document.getElementById('iosCount').textContent = iosCount;

      const androidCount = devices.filter(d => d.metadata?.deviceType === 'Android').length;
      document.getElementById('androidCount').textContent = androidCount;
    }

    // Render device list
    function renderDevices(devices) {
      const listEl = document.getElementById('deviceList');

      if (!devices || devices.length === 0) {
        listEl.innerHTML = '<div class="empty"><i class="fas fa-mobile-alt"></i><p>No devices found</p></div>';
        return;
      }

      listEl.innerHTML = devices.map(device => renderDevice(device)).join('');
    }

    // Render individual device
    function renderDevice(device) {
      const meta = device.metadata || {};
      const deviceType = meta.deviceType || 'unknown';
      const debugMode = meta.debugMode || false;
      const currentUsername = meta.currentUsername || 'not-logged-in';
      const usernameHistory = meta.usernameHistory || [];
      const comment = meta.comment || '';
      const lastSeen = meta.lastSeen ? new Date(meta.lastSeen).toLocaleString() : 'Never';
      const hasLogs = device.logFileCount > 0;

      return `
        <div class="device-item">
          <div class="device-header">
            <div class="device-id">${device.deviceId}</div>
            <div class="device-badges">
              ${deviceType === 'iOS' ? '<span class="badge badge-ios"><i class="fab fa-apple"></i> iOS</span>' : ''}
              ${deviceType === 'Android' ? '<span class="badge badge-android"><i class="fab fa-android"></i> Android</span>' : ''}
              ${debugMode ? '<span class="badge badge-debug"><i class="fas fa-bug"></i> Debug Mode</span>' : ''}
            </div>
          </div>

          <div class="device-info">
            <div class="info-item">
              <div class="label">Current Username</div>
              <div class="value">${currentUsername}</div>
            </div>
            <div class="info-item">
              <div class="label">Last Seen</div>
              <div class="value">${lastSeen}</div>
            </div>
            <div class="info-item">
              <div class="label">Log Files</div>
              <div class="value">${device.logFileCount} files</div>
            </div>
            <div class="info-item">
              <div class="label">Update Count</div>
              <div class="value">${meta.updateCount || 0}</div>
            </div>
          </div>

          ${usernameHistory.length > 0 ? `
            <div class="info-item">
              <div class="label">Username History</div>
              <div class="username-list">
                ${usernameHistory.map(u => `<span class="username-tag">${u}</span>`).join('')}
              </div>
            </div>
          ` : ''}

          ${comment ? `
            <div class="comment-section">
              <div class="comment-display">
                <strong>Comment:</strong> ${escapeHtml(comment)}
              </div>
            </div>
          ` : ''}

          <div class="comment-section">
            <div class="comment-form">
              <input 
                type="text" 
                class="comment-input" 
                placeholder="Add a comment to identify this device..." 
                value="${escapeHtml(comment)}"
                id="comment-${device.deviceId}"
              />
              <button class="comment-btn" onclick="updateComment('${device.deviceId}')">
                <i class="fas fa-save"></i> Save
              </button>
            </div>
          </div>

          <button 
            class="view-logs-btn" 
            ${!hasLogs ? 'disabled' : ''}
            onclick="viewLogs('${device.deviceId}')"
          >
            <i class="fas fa-file-alt"></i> View Logs (${device.logFileCount})
          </button>
        </div>
      `;
    }

    // Update comment for a device
    async function updateComment(deviceId) {
      const input = document.getElementById(`comment-${deviceId}`);
      const comment = input.value.trim();

      try {
        const response = await fetch(`/api/logs/mobile/${deviceId}/comment`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comment })
        });

        if (response.ok) {
          alert('Comment saved successfully!');
          loadDevices(); // Reload to show updated comment
        } else {
          alert('Failed to save comment');
        }
      } catch (err) {
        alert('Error saving comment: ' + err.message);
      }
    }

    // View logs for a device
    function viewLogs(deviceId) {
      window.open(`/api/logs/mobile/${deviceId}`, '_blank');
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Auto-refresh every 30 seconds
    setInterval(loadDevices, 30000);

    // Initial load
    loadDevices();
  </script>
</body>
</html>
