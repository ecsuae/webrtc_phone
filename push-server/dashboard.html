<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Device Debug Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/src/dashboard/styles.css?v=20260310-r1">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-mobile-alt"></i> Mobile Device Debug Dashboard</h1>
      <p>Track and debug mobile WebRTC clients</p>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Total Devices</div>
        <div class="value" id="totalDevices">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Debug Mode Active</div>
        <div class="value" id="debugActive">-</div>
      </div>
      <div class="stat-card">
        <div class="label">iOS Devices</div>
        <div class="value" id="iosCount">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Android Devices</div>
        <div class="value" id="androidCount">-</div>
      </div>
    </div>

    <div class="devices-container">
      <div class="devices-header">
        <h2>Devices</h2>
        <button class="refresh-btn" onclick="loadDevices()">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
      </div>
      <div class="device-list" id="deviceList">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i> Loading devices...
        </div>
      </div>
    </div>
  </div>

  <script src="/src/dashboard/dashboard.js?v=20260310-r1"></script>
</body>
</html>
