#!KAMAILIO

# ============================================================
#  kamailio.cfg  (WebRTC WS/WSS -> SIP + RTPengine bridge)
#  - Fixes: WebSocket registration (SIP.js) + RTPengine media
#  - Design: Kamailio acts as a PROXY (registrations go to PBX)
#  - Works with Docker: rtpengine reachable as "rtpengine:22222"
#
#  ENV you can set in docker-compose for kamailio container:
#    PBX_HOST=fusn04.srve.cc
#    PBX_PORT=5060
#    KAM_PUBLIC_IP=85.235.64.159   (optional but recommended)
#
#  Ports expected:
#    - UDP/TCP 5060 for SIP (optional, but useful)
#    - WS 8443 (your reverse proxy may terminate TLS and forward to this)
#
#  NOTE:
#    - If you terminate TLS at Nginx/Traefik, Kamailio only needs WS (not WSS).
# ============================================================

####### Global Parameters #########

debug=3
log_stderror=yes

memdbg=5
memlog=5

# Allow TCP requests without Content-Length (needed for WebSocket handshakes)
tcp_accept_no_cl=1

fork=yes
children=8

# --- If you have a public IP, set it via env KAM_PUBLIC_IP, otherwise comment out.
#     In Docker behind NAT, this helps correct Via/Contact handling.
#!ifdef KAM_PUBLIC_IP
alias="$env(KAM_PUBLIC_IP)"
#!endif

# Listen SIP (advertise public IP so PBX can reply)
listen=udp:0.0.0.0:5060 advertise 38.242.157.239:5060
listen=tcp:0.0.0.0:5060 advertise 38.242.157.239:5060

# Listen WebSocket (reverse proxy -> ws://kamailio:8443)
# CRITICAL: Advertise both transport=ws and actual port 8443
listen=tcp:0.0.0.0:8443 advertise 38.242.157.239:8443

# DNS / Resolver
dns_try_ipv6=no
auto_aliases=no

# ============================================================
# Modules
# ============================================================

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "pv.so"
loadmodule "kex.so"

# WebSocket
loadmodule "xhttp.so"
loadmodule "websocket.so"

# NAT helpers
loadmodule "nathelper.so"

# RTPengine
loadmodule "rtpengine.so"

loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

loadmodule "path.so"
loadmodule "outbound.so"
loadmodule "uac.so"

# ============================================================
# Module Parameters
# ============================================================

# --- tm ---
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 30000)
modparam("tm", "restart_fr_on_each_reply", 0)


# --- rr ---
modparam("rr", "enable_full_lr", 1)

# --- websocket ---
# Keep WS connections stable
modparam("websocket", "keepalive_mechanism", 1)     # ping/pong
modparam("websocket", "keepalive_timeout", 30)


# --- nathelper ---
modparam("nathelper", "natping_interval", 0)
modparam("nathelper", "ping_nated_only", 1)

# --- rtpengine ---
# All services in host network mode, use localhost
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")

modparam("usrloc", "db_mode", 0)

modparam("registrar", "received_avp", "$avp(received)")

modparam("nathelper", "received_avp", "$avp(received)")

# --- path ---
modparam("path", "use_received", 1)


# ============================================================
# Routing Logic
# ============================================================

# Where to send SIP signaling (your FusionPBX)
# PBX host/IP is taken from the environment variable `PBX_IP` (recommended).
# Do NOT hard-code the PBX host here; set `PBX_IP` in your Docker-compose/.env.
# Example: PBX_IP=fusn04.srve.cc
# Note: PBX_PORT and PBX_TRANSPORT may be provided via env as well.

# ------------------------------------------------------------
# Main Request Route
# ------------------------------------------------------------
# --- usrloc / registrar must share the same received_avp ---
modparam("registrar", "received_avp", "$avp(received)")

# nathelper fix_nated_register() requires nathelper received_avp too
modparam("nathelper", "received_avp", "$avp(received)")

# ============================================================
# WebSocket HTTP handler (MANDATORY)
# ============================================================
# ============================================================
# WebSocket HTTP handler (ONLY ONE - do not duplicate)
# ============================================================
event_route[xhttp:request] {
    xlog("L_INFO", "HTTP request $rm from $si:$sp to $hu (port=$Rp)\n");

    # Only allow HTTP/WS on the WS listen port
    if ($Rp != 8443) {
        xhttp_reply("403", "Forbidden", "text/plain", "Forbidden\n");
        exit;
    }

    # WebSocket handshake
    if ($rm == "GET" && ($hdr(Upgrade) =~ "websocket" || $hdr(Connection) =~ "Upgrade")) {
        ws_handle_handshake();
        exit;
    }

    # Everything else
    xhttp_reply("404", "Not Found", "text/plain", "Not Found\n");
    exit;
}

request_route {
    # ============================================================
    # SECURITY: Block unauthorized IPs on UDP/TCP 5060
    # ============================================================
    # Allow only: PBX IP, localhost/self, and WebSocket (via Nginx)
    if ($proto != "ws" && $proto != "wss") {
        # Whitelist: PBX, localhost, and self IP only
        # Block all other traffic on UDP/TCP 5060 (spam protection)
        if ($si != "185.187.169.29" && $si != "127.0.0.1" && $si != "38.242.157.239") {
            xlog("L_WARN", "BLOCKED unauthorized SIP: $rm from $si:$sp to $ru\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
    }

    # If PBX sends a request to a Contact with ;alias=... (WS flow token),
  # this restores the correct destination (the active WS connection).
  handle_ruri_alias();

    # --- WebSocket SIP ---
    if ($proto == "ws" || $proto == "wss") {
        if (!has_totag()) {
            xlog("L_INFO", "WS SIP $rm from $si:$sp\n");
        }
        force_rport();
    }

    # --- sanity ---
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if ($rm == "OPTIONS" && $ru == "sip:ping@kamailio") {
        sl_send_reply("200", "OK");
        exit;
    }

    # --- drop invalid ---
    if (!sanity_check("1511", "7")) {
        sl_send_reply("400", "Bad Request");
        exit;
    }

    # --- transaction / retransmission guard ---
    # Prevent duplicate forwarding (e.g., repeated INVITE over WS/TCP)
    # IMPORTANT: exclude CANCEL, it must reach the dedicated CANCEL block below
    if (!is_method("ACK|CANCEL") && t_check_trans()) {
        exit;
    }

    # --- NAT / WS helpers ---
    # For WS clients, SIP.js needs contact alias so responses can find the same WS connection.
    if ($proto =~ "ws") {
        set_contact_alias();
    }

    # REGISTER
    if (is_method("REGISTER")) {
        route(FIX_NAT_REGISTER);

        # Make PBX route back via this proxy (RFC 3327 Path)
        add_path_received();

        # Relay to PBX for authentication - PBX will reply 200 OK or 401
        route(RELAY_TO_PBX);
        exit;
    }

    # In-dialog requests (ACK/BYE/re-INVITE)
    if (has_totag()) {
        route(WITHIN_DIALOG);
        exit;
    }

    # Handle CANCEL quickly
    if (is_method("CANCEL")) {
        xlog("L_INFO", "CANCEL received for $ru from $si:$sp\n");
        if (t_check_trans()) {
            xlog("L_INFO", "CANCEL: Transaction found, relaying to $du\n");
            t_relay();
        } else {
            xlog("L_WARN", "CANCEL: No matching transaction found\n");
        }
        exit;
    }

    # New INVITE: record-route and check if destination is local
    if (is_method("INVITE")) {
        record_route();

        # Mark WebRTC calls with AVP for proper media handling (persists across transaction)
        if ($proto =~ "ws") {
            $avp(is_webrtc) = 1;
            xlog("L_INFO", "INVITE from WebSocket, marking is_webrtc=1\n");
        }

        # CRITICAL: Check if destination is local BEFORE processing media
        # This sets is_local_call flag for proper RTPEngine configuration
        # ONLY route locally if destination is a simple extension (numeric 3-9 digits)
        if ($rU =~ "^[0-9]{3,9}$" && lookup("location")) {
            xlog("L_INFO", "INVITE: $rU found locally registered, marking as ext-to-ext call\n");
            # Mark this as a local-to-local call BEFORE media processing
            $avp(is_local_call) = 1;
        }

        # Now process media with correct is_local_call flag
        if (has_body("application/sdp")) {
            xlog("L_INFO", "INVITE has SDP body, calling route(MEDIA_OFFER)\n");
            route(MEDIA_OFFER);
        } else {
            xlog("L_WARN", "INVITE has NO SDP body!\n");
        }

        # If destination is local, route directly
        if ($avp(is_local_call) == 1) {
            xlog("L_INFO", "INVITE: routing ext-to-ext call to $du\n");
            
            # Handle WebSocket alias to restore proper WS connection
            handle_ruri_alias();
            
            # Set reply routes for proper handling
            t_on_reply("MANAGE_REPLY");
            t_on_reply("LOCAL_CALL_REPLY");
            
            # Relay directly to the local registered contact
            if (!t_relay()) {
                xlog("L_ERR", "Failed to relay INVITE to local contact\n");
                sl_reply_error();
            }
            exit;
        }

        # Not registered locally, will be relayed to PBX below
        xlog("L_INFO", "INVITE: destination '$rU' not found locally, relaying to PBX\n");
    }

    # Subscribe/Refer: still record-route for dialog correctness
    if (is_method("SUBSCRIBE|REFER")) {
        record_route();
    }

    # Relay anything else to PBX
    route(RELAY_TO_PBX);
}

# ------------------------------------------------------------
# NAT register fixes
# ------------------------------------------------------------
route[FIX_NAT_REGISTER] {

    # If SIP.js behind NAT: fix contact and ensure alias.
    # (set_contact_alias already done for $proto =~ "ws")
    if (nat_uac_test("19")) {
        fix_nated_register();
    }
    return;
}


# ------------------------------------------------------------
# In-dialog routing
# ------------------------------------------------------------
route[WITHIN_DIALOG] {

    if (loose_route()) {

        # If ACK includes SDP, finalize media answer
        if (is_method("ACK") && has_body("application/sdp")) {
            xlog("L_INFO", "WITHIN_DIALOG: ACK with SDP (may be ext-to-ext)\n");
            route(MEDIA_ANSWER);
        }

        # BYE: delete rtpengine session
        if (is_method("BYE")) {
            xlog("L_INFO", "WITHIN_DIALOG: BYE - cleaning up RTP session\n");
            route(MEDIA_DELETE);
        }

        # Keep WS alias for all in-dialog frames
        if ($proto =~ "ws") {
            set_contact_alias();
        }

        route(RELAY);
        exit;
    }

    # Fallback: ext-to-ext calls may arrive without Route header set,
    # but handle_ruri_alias() already resolved the WS destination into $du.
    # This is critical for local extension calls to complete properly.
    if ($du != $null && $du != "" && is_method("BYE|ACK|INFO|UPDATE|NOTIFY|PRACK|MESSAGE|REFER")) {
        xlog("L_INFO", "WITHIN_DIALOG fallback relay for $rm with $du (ext-to-ext support)\n");
        
        # Ensure WS alias is maintained even in fallback path
        if ($proto =~ "ws") {
            set_contact_alias();
        }
        
        route(RELAY);
        exit;
    }

    # No loose_route => not for us
    sl_send_reply("404", "Not Here");
    exit;
}


# ------------------------------------------------------------
# Relay to PBX helper (centralized)
# ------------------------------------------------------------
route[RELAY_TO_PBX] {
    # PBX host must come from env PBX_IP (or fail loudly)
    $var(pbx_host) = $env(PBX_IP);
    if ($var(pbx_host) == $null || $var(pbx_host) == "") {
        xlog("L_ERR", "RELAY_TO_PBX: PBX_IP not set in environment; cannot relay\n");
        sl_send_reply("503", "Server Error");
        exit;
    }

    # PBX port: default 5060 when not provided
    $var(pbx_port) = $env(PBX_PORT);
    if ($var(pbx_port) == $null || $var(pbx_port) == "") {
        $var(pbx_port) = "5060";
    }

    # Transport: default udp
    $var(pbx_transport) = $env(PBX_TRANSPORT);
    if ($var(pbx_transport) == $null || $var(pbx_transport) == "") {
        $var(pbx_transport) = "udp";
    }

    xlog("L_INFO", "RELAY_TO_PBX via $var(pbx_transport) to $var(pbx_host):$var(pbx_port) from $si:$sp | Method: $rm, Request-URI: $ru, From: $fu, To: $tu\n");

    # PBX only understands standard UDP SIP transport
    # Normalize Via transport token WS/WSS -> UDP
    if ($proto == "ws" || $proto == "wss") {
        subst_hf("Via", "/SIP\/2.0\/(WSS|WS)/SIP\/2.0\/UDP/ig", "a");

        # UDP-only PBX compatibility for WebRTC REGISTER
        # Keep call-dialog headers untouched so BYE/re-INVITE routing remains stable.
        if (is_method("REGISTER")) {
            subst_hf("Contact", "/;transport=(wss|ws)//ig", "a");
            subst_hf("Contact", "/;alias=[^;>]*//ig", "a");
        }

        msg_apply_changes();
    }

    # Send everything to FusionPBX (registrations and calls)
    $du = "sip:" + $var(pbx_host) + ":" + $var(pbx_port) + ";transport=" + $var(pbx_transport);

    # Let us touch replies (useful for SDP answer)
    t_on_reply("MANAGE_REPLY");

    route(RELAY);
    exit;
}


# ------------------------------------------------------------
# Actual relay
# ------------------------------------------------------------
route[RELAY] {

    # Required for stateful forwarding
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}


# ------------------------------------------------------------
# Reply route (handles 200 OK SDP, etc.)
# ------------------------------------------------------------
onreply_route[MANAGE_REPLY] {
    xlog("L_INFO", "=== MANAGE_REPLY ENTERED: status=$rs from $si:$sp proto=$proto method=$rm ===\n");

    # Keep WS aliasing stable for replies too
    if ($proto =~ "ws") {
        set_contact_alias();
    }

    # Save REGISTER to location table when PBX responds 200 OK
    # This allows ext-to-ext calls while keeping PBX as authoritative source
    if (is_method("REGISTER") && status =~ "2[0-9][0-9]") {
        xlog("L_INFO", "MANAGE_REPLY: PBX accepted REGISTER, saving to location table for ext-to-ext\n");
        if (!save("location")) {
            xlog("L_ERR", "MANAGE_REPLY: Failed to save registration for $fu\n");
        } else {
            xlog("L_INFO", "MANAGE_REPLY: Saved $fu to location table\n");
        }
    }

    # When PBX replies with SDP (e.g., 183/200), bridge with rtpengine_answer
    if (status=~"18[0-9]|2[0-9][0-9]") {
        xlog("L_INFO", "MANAGE_REPLY: provisional or success response, checking for SDP\n");
        if (has_body("application/sdp")) {
            xlog("L_INFO", "MANAGE_REPLY: SDP found, calling MEDIA_ANSWER\n");
            route(MEDIA_ANSWER);
        } else {
            xlog("L_WARN", "MANAGE_REPLY: Response but NO SDP body detected\n");
        }
    }

    exit;
}

# ============================================================
# Local Call Reply Route (for ext-to-ext calls)
# ============================================================
onreply_route[LOCAL_CALL_REPLY] {
    xlog("L_INFO", "LOCAL_CALL_REPLY: reply from locally registered extension\n");

    # Ensure WebSocket alias is properly restored for replies
    if ($proto =~ "ws") {
        xlog("L_INFO", "LOCAL_CALL_REPLY: Restoring WebSocket alias for ext-to-ext reply\n");
        set_contact_alias();
    }

    # Handle early media (180 Ringing with SDP) for ext-to-ext calls
    # This allows the calling browser to hear ringtone from called browser
    if (status =~ "18[0-9]" && has_body("application/sdp")) {
        xlog("L_INFO", "LOCAL_CALL_REPLY: Early media detected (180 with SDP), calling MEDIA_ANSWER for ext-to-ext\n");
        route(MEDIA_ANSWER);
    }

    # When called extension replies with answer SDP (200 OK), process media answer
    if (status=~"2[0-9][0-9]" && has_body("application/sdp")) {
        xlog("L_INFO", "LOCAL_CALL_REPLY: 200 OK with SDP, calling MEDIA_ANSWER for ext-to-ext\n");
        route(MEDIA_ANSWER);
    }

    # Log provisional responses
    if (status =~ "18[0-9]") {
        xlog("L_INFO", "LOCAL_CALL_REPLY: Provisional response for ext-to-ext call\n");
    }

    exit;
}


# ============================================================
# RTPENGINE MEDIA ROUTES
# ============================================================

route[MEDIA_OFFER] {
    xlog("L_INFO", "=== MEDIA_OFFER START from $si:$sp is_webrtc=$avp(is_webrtc) is_local=$avp(is_local_call) ===\n");
    xlog("L_INFO", "MEDIA_OFFER: Request body length=$ml bytes\n");

    # For ext-to-ext calls (both WebRTC), bridge two DTLS/SRTP streams
    if ($avp(is_local_call) == 1) {
        xlog("L_INFO", "MEDIA_OFFER: ext-to-ext WebRTC call (DTLS bridging)\n");
        # ICE=force: RTPEngine acts as ICE endpoint
        # DTLS=passive: RTPEngine accepts DTLS connection from caller
        # asymmetric: allow one-way media if needed
        # media-address=PUBLIC_IP: ensure reachable media address
        if (rtpengine_offer("replace-origin replace-session-connection asymmetric ICE=force DTLS=passive media-address=38.242.157.239")) {
            xlog("L_INFO", "rtpengine_offer() SUCCESS (ext-to-ext)\n");
        } else {
            xlog("L_ERR", "rtpengine_offer() FAILED!\n");
        }
    } else {
        # Standard WebRTC-to-PBX: proper bridging
        # Direction: from WebRTC (SRTP/ICE/DTLS) to PBX (RTP)
        xlog("L_INFO", "MEDIA_OFFER: WebRTC-to-PBX call\n");
        if (rtpengine_offer("RTP/AVP replace-origin replace-session-connection ICE=remove DTLS=passive")) {
            xlog("L_INFO", "rtpengine_offer() SUCCESS (webrtc-pbx)\n");
        } else {
            xlog("L_ERR", "rtpengine_offer() FAILED!\n");
        }
    }

    return;
}

route[MEDIA_ANSWER] {
    xlog("L_INFO", "=== MEDIA_ANSWER START from $si:$sp is_webrtc=$avp(is_webrtc) is_local=$avp(is_local_call) ===\n");
    xlog("L_INFO", "MEDIA_ANSWER: Response code=$rs, body_length=$ml\n");

    # For ext-to-ext calls (both WebRTC), bridge two DTLS/SRTP streams
    if ($avp(is_local_call) == 1) {
        xlog("L_INFO", "MEDIA_ANSWER: ext-to-ext WebRTC call (DTLS bridging)\n");
        # ICE=force: RTPEngine acts as ICE endpoint
        # DTLS=passive: RTPEngine accepts DTLS connection from callee
        # asymmetric: allow one-way media if needed
        # media-address=PUBLIC_IP: ensure reachable media address
        if (rtpengine_answer("replace-origin replace-session-connection asymmetric ICE=force DTLS=passive media-address=38.242.157.239")) {
            xlog("L_INFO", "rtpengine_answer() SUCCESS (ext-to-ext)\n");
        } else {
            xlog("L_ERR", "rtpengine_answer() FAILED!\n");
        }
    } else {
        # Standard WebRTC-to-PBX: convert PBX answer (RTP) back to WebRTC (SRTP/ICE/DTLS)
        xlog("L_INFO", "MEDIA_ANSWER: WebRTC-to-PBX call, processing answer from PBX\n");
        if (rtpengine_answer("RTP/SAVPF replace-origin replace-session-connection ICE=force DTLS=passive")) {
            xlog("L_INFO", "rtpengine_answer() SUCCESS (webrtc-pbx)\n");
        } else {
            xlog("L_ERR", "rtpengine_answer() FAILED!\n");
        }
    }

    return;
}

route[MEDIA_DELETE] {
    xlog("L_INFO", "MEDIA_DELETE rtpengine_delete()\n");
    rtpengine_delete();
    return;
}
