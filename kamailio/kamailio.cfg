#!KAMAILIO

# ============================================================
#  kamailio.cfg  (WebRTC WS/WSS -> SIP + RTPengine bridge)
#  - Fixes: WebSocket registration (SIP.js) + RTPengine media
#  - Design: Kamailio acts as a PROXY (registrations go to PBX)
#  - Works with Docker: rtpengine reachable as "rtpengine:22222"
#
#  ENV you can set in docker-compose for kamailio container:
#    PBX_HOST=fusn04.srve.cc
#    PBX_PORT=5060
#    KAM_PUBLIC_IP=85.235.64.159   (optional but recommended)
#
#  Ports expected:
#    - UDP/TCP 5060 for SIP (optional, but useful)
#    - WS 8443 (your reverse proxy may terminate TLS and forward to this)
#
#  NOTE:
#    - If you terminate TLS at Nginx/Traefik, Kamailio only needs WS (not WSS).
# ============================================================

####### Global Parameters #########

debug=3
log_stderror=yes

memdbg=5
memlog=5

# Allow TCP requests without Content-Length (needed for WebSocket handshakes)
tcp_accept_no_cl=1

fork=yes
children=8

# --- If you have a public IP, set it via env KAM_PUBLIC_IP, otherwise comment out.
#     In Docker behind NAT, this helps correct Via/Contact handling.
#!ifdef KAM_PUBLIC_IP
alias="$env(KAM_PUBLIC_IP)"
#!endif

# Listen SIP (advertise public IP so PBX can reply)
listen=udp:0.0.0.0:5060 advertise 38.242.157.239:5060
listen=tcp:0.0.0.0:5060 advertise 38.242.157.239:5060

# Listen WebSocket (reverse proxy -> ws://kamailio:8443)
# CRITICAL: Advertise both transport=ws and actual port 8443
listen=tcp:0.0.0.0:8443 advertise 38.242.157.239:8443

# DNS / Resolver
dns_try_ipv6=no
auto_aliases=no

# ============================================================
# Modules
# ============================================================

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "pv.so"
loadmodule "kex.so"

# WebSocket
loadmodule "xhttp.so"
loadmodule "websocket.so"

# NAT helpers
loadmodule "nathelper.so"

# RTPengine
loadmodule "rtpengine.so"

loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

loadmodule "path.so"
loadmodule "outbound.so"
loadmodule "uac.so"
loadmodule "htable.so"

# ============================================================
# Module Parameters
# ============================================================

# --- htable ---
# Hash table for tracking WebSocket connection ID to AOR mapping
# Used to send unregister to PBX when WebSocket closes
modparam("htable", "htable", "wsconn=>size=8;autoexpire=7200;")

# --- tm ---
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 30000)
modparam("tm", "restart_fr_on_each_reply", 0)


# --- rr ---
modparam("rr", "enable_full_lr", 1)

# --- websocket ---
# Keep WS connections stable
modparam("websocket", "keepalive_mechanism", 1)     # ping/pong
modparam("websocket", "keepalive_timeout", 30)


# --- nathelper ---
modparam("nathelper", "natping_interval", 0)
modparam("nathelper", "ping_nated_only", 1)

# --- rtpengine ---
# All services in host network mode, use localhost
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")

modparam("usrloc", "db_mode", 0)

modparam("registrar", "received_avp", "$avp(received)")

modparam("nathelper", "received_avp", "$avp(received)")

# --- path ---
modparam("path", "use_received", 1)


# ============================================================
# Routing Logic
# ============================================================

# Where to send SIP signaling (your FusionPBX)
# PBX host/IP is taken from the environment variable `PBX_IP` (recommended).
# Do NOT hard-code the PBX host here; set `PBX_IP` in your Docker-compose/.env.
# Example: PBX_IP=fusn04.srve.cc
# Note: PBX_PORT and PBX_TRANSPORT may be provided via env as well.

# ------------------------------------------------------------
# Main Request Route
# ------------------------------------------------------------
# --- usrloc / registrar must share the same received_avp ---
modparam("registrar", "received_avp", "$avp(received)")

# nathelper fix_nated_register() requires nathelper received_avp too
modparam("nathelper", "received_avp", "$avp(received)")

# ============================================================
# WebSocket HTTP handler (MANDATORY)
# ============================================================
# ============================================================
# WebSocket HTTP handler (ONLY ONE - do not duplicate)
# ============================================================
event_route[xhttp:request] {
    xlog("L_INFO", "HTTP request $rm from $si:$sp to $hu (port=$Rp)\n");

    # Only allow HTTP/WS on the WS listen port
    if ($Rp != 8443) {
        xhttp_reply("403", "Forbidden", "text/plain", "Forbidden\n");
        exit;
    }

    # WebSocket handshake
    if ($rm == "GET" && ($hdr(Upgrade) =~ "websocket" || $hdr(Connection) =~ "Upgrade")) {
        ws_handle_handshake();
        exit;
    }

    # Everything else
    xhttp_reply("404", "Not Found", "text/plain", "Not Found\n");
    exit;
}

# ============================================================
# WebSocket Connection Closed Handler
# Triggered when WebSocket disconnects (browser closed, network fail, etc.)
# Automatically unregisters from PBX and local location table
# ============================================================
event_route[websocket:closed] {
    xlog("L_INFO", "========== WebSocket Closed from $si:$sp ==========\n");
    
    # Use source IP:port as key to find the stored AOR
    $var(ws_key) = $si + ":" + $sp;
    $var(aor) = $sht(wsconn=>$var(ws_key));
    
    if ($var(aor) != $null && $var(aor) != "") {
        xlog("L_INFO", "WebSocket closed: Found AOR for $var(ws_key): $var(aor)\n");
        
        # Remove from local location table
        if (unregister("location", "$var(aor)")) {
            xlog("L_INFO", "WebSocket closed: Removed $var(aor) from local location\n");
        } else {
            xlog("L_WARN", "WebSocket closed: Failed to remove $var(aor) from location (may not exist)\n");
        }
        
        # Send unregister to PBX (REGISTER with Contact: * Expires: 0)
        route(SEND_UNREGISTER_TO_PBX);
        
        # Clean up the hash table entry
        $sht(wsconn=>$var(ws_key)) = $null;
        xlog("L_INFO", "WebSocket closed: Cleanup complete for $var(aor)\n");
    } else {
        xlog("L_INFO", "WebSocket closed: No AOR found for $var(ws_key) - may be already cleaned or never registered\n");
    }
}

# ============================================================
# CORE: Pre-Routing Event (earliest possible point)
# ============================================================
event_route[core:pre-routing] {
    if (!has_totag()) {
        xlog("L_WARN", "*** CORE PRE-ROUTING: $rm from $si:$sp to $ru proto=$proto body_len=$ml ci=$ci ***\n");
    }
}

# ============================================================
# Trusted SIP source evaluation
# Allows static infra sources plus .env-managed trusted IPs/domains.
# Sets: $var(trusted_source) = 1 (trusted) / 0 (untrusted)
# ============================================================
route[TRUSTED_SIP_SOURCE] {
    $var(trusted_source) = 0;

    # Static infra IPs (local host, SBC, known peers)
    if ($si == "85.235.64.159" || $si == "185.187.169.29" || $si == "188.34.145.229" || $si == "127.0.0.1" || $si == "38.242.157.239" || $si == "172.18.0.2" || $si == "172.110.223.45" || $si == "172.110.223.33") {
        $var(trusted_source) = 1;
        return;
    }

    # Extra trusted SIP IPs from .env (up to 8 entries)
    if (($env(TRUSTED_SIP_IP_1) != $null && $env(TRUSTED_SIP_IP_1) != "" && $si == $env(TRUSTED_SIP_IP_1)) ||
        ($env(TRUSTED_SIP_IP_2) != $null && $env(TRUSTED_SIP_IP_2) != "" && $si == $env(TRUSTED_SIP_IP_2)) ||
        ($env(TRUSTED_SIP_IP_3) != $null && $env(TRUSTED_SIP_IP_3) != "" && $si == $env(TRUSTED_SIP_IP_3)) ||
        ($env(TRUSTED_SIP_IP_4) != $null && $env(TRUSTED_SIP_IP_4) != "" && $si == $env(TRUSTED_SIP_IP_4)) ||
        ($env(TRUSTED_SIP_IP_5) != $null && $env(TRUSTED_SIP_IP_5) != "" && $si == $env(TRUSTED_SIP_IP_5)) ||
        ($env(TRUSTED_SIP_IP_6) != $null && $env(TRUSTED_SIP_IP_6) != "" && $si == $env(TRUSTED_SIP_IP_6)) ||
        ($env(TRUSTED_SIP_IP_7) != $null && $env(TRUSTED_SIP_IP_7) != "" && $si == $env(TRUSTED_SIP_IP_7)) ||
        ($env(TRUSTED_SIP_IP_8) != $null && $env(TRUSTED_SIP_IP_8) != "" && $si == $env(TRUSTED_SIP_IP_8))) {
        $var(trusted_source) = 1;
        return;
    }

    # Built-in Fusion tenant domains
    if ($rd =~ "^fusn0[1-8]\\.srve\\.cc$" || $td =~ "^fusn0[1-8]\\.srve\\.cc$" || $fd =~ "^fusn0[1-8]\\.srve\\.cc$") {
        $var(trusted_source) = 1;
        return;
    }

    # Extra trusted domains from .env (up to 8 entries)
    if (($env(TRUSTED_SIP_DOMAIN_1) != $null && $env(TRUSTED_SIP_DOMAIN_1) != "" && ($rd == $env(TRUSTED_SIP_DOMAIN_1) || $td == $env(TRUSTED_SIP_DOMAIN_1) || $fd == $env(TRUSTED_SIP_DOMAIN_1))) ||
        ($env(TRUSTED_SIP_DOMAIN_2) != $null && $env(TRUSTED_SIP_DOMAIN_2) != "" && ($rd == $env(TRUSTED_SIP_DOMAIN_2) || $td == $env(TRUSTED_SIP_DOMAIN_2) || $fd == $env(TRUSTED_SIP_DOMAIN_2))) ||
        ($env(TRUSTED_SIP_DOMAIN_3) != $null && $env(TRUSTED_SIP_DOMAIN_3) != "" && ($rd == $env(TRUSTED_SIP_DOMAIN_3) || $td == $env(TRUSTED_SIP_DOMAIN_3) || $fd == $env(TRUSTED_SIP_DOMAIN_3))) ||
        ($env(TRUSTED_SIP_DOMAIN_4) != $null && $env(TRUSTED_SIP_DOMAIN_4) != "" && ($rd == $env(TRUSTED_SIP_DOMAIN_4) || $td == $env(TRUSTED_SIP_DOMAIN_4) || $fd == $env(TRUSTED_SIP_DOMAIN_4))) ||
        ($env(TRUSTED_SIP_DOMAIN_5) != $null && $env(TRUSTED_SIP_DOMAIN_5) != "" && ($rd == $env(TRUSTED_SIP_DOMAIN_5) || $td == $env(TRUSTED_SIP_DOMAIN_5) || $fd == $env(TRUSTED_SIP_DOMAIN_5))) ||
        ($env(TRUSTED_SIP_DOMAIN_6) != $null && $env(TRUSTED_SIP_DOMAIN_6) != "" && ($rd == $env(TRUSTED_SIP_DOMAIN_6) || $td == $env(TRUSTED_SIP_DOMAIN_6) || $fd == $env(TRUSTED_SIP_DOMAIN_6))) ||
        ($env(TRUSTED_SIP_DOMAIN_7) != $null && $env(TRUSTED_SIP_DOMAIN_7) != "" && ($rd == $env(TRUSTED_SIP_DOMAIN_7) || $td == $env(TRUSTED_SIP_DOMAIN_7) || $fd == $env(TRUSTED_SIP_DOMAIN_7))) ||
        ($env(TRUSTED_SIP_DOMAIN_8) != $null && $env(TRUSTED_SIP_DOMAIN_8) != "" && ($rd == $env(TRUSTED_SIP_DOMAIN_8) || $td == $env(TRUSTED_SIP_DOMAIN_8) || $fd == $env(TRUSTED_SIP_DOMAIN_8)))) {
        $var(trusted_source) = 1;
        return;
    }
}

request_route {
    # ============================================================
    # EARLY DEBUG: Log all initial requests
    # ============================================================
    if (!has_totag()) {
        xlog("L_INFO", "=== REQUEST_ROUTE ENTRY: $rm from $si:$sp to $ru proto=$proto ci=$ci ===\n");
    }

    # ============================================================
    # SECURITY: Block unauthorized IPs on UDP/TCP 5060
    # ============================================================
    # Allow only: PBX IP, localhost/self, and WebSocket (via Nginx)
    if ($proto != "ws" && $proto != "wss") {
        if (is_method("INVITE") && !has_totag()) {
            xlog("L_INFO", "TRACE INITIAL NON-WS INVITE: src=$si:$sp proto=$proto ru=$ru fu=$fu tu=$tu ci=$ci\n");
        }
        # In-dialog requests (with totag) are always allowed - they're from established dialogs
        if (!has_totag()) {
            route(TRUSTED_SIP_SOURCE);
            if ($var(trusted_source) == 0) {
                xlog("L_WARN", "BLOCKED unauthorized SIP: $rm from $si:$sp to $ru (rd=$rd td=$td fd=$fd)\n");
                sl_send_reply("403", "Forbidden");
                exit;
            }
        } else {
            # In-dialog request from any source - just log and allow
            xlog("L_INFO", "SECURITY: Allowing in-dialog $rm from $si:$sp (totag present)\n");
        }
    }

    # If PBX sends a request to a Contact with ;alias=... (WS flow token),
  # this restores the correct destination (the active WS connection).
  handle_ruri_alias();

    # --- WebSocket SIP ---
    if ($proto == "ws" || $proto == "wss") {
        if (!has_totag()) {
            xlog("L_INFO", "WS SIP $rm from $si:$sp\n");
        }
        force_rport();
    }

    # --- sanity ---
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if ($rm == "OPTIONS" && $ru == "sip:ping@kamailio") {
        sl_send_reply("200", "OK");
        exit;
    }

    # --- drop invalid ---
    if (!sanity_check("1511", "7")) {
        xlog("L_ERR", "SANITY CHECK FAILED: $rm from $si:$sp to $ru - returning 400\n");
        sl_send_reply("400", "Bad Request");
        exit;
    }

    if (!has_totag()) {
        xlog("L_INFO", "SANITY CHECK PASSED: Continuing with $rm from $si:$sp to $ru\n");
    }

    # --- transaction / retransmission guard ---
    # Prevent duplicate forwarding (e.g., repeated INVITE over WS/TCP)
    # IMPORTANT: exclude CANCEL, it must reach the dedicated CANCEL block below
    if (!is_method("ACK|CANCEL") && t_check_trans()) {
        exit;
    }

    # --- NAT / WS helpers ---
    # For WS clients, SIP.js needs contact alias so responses can find the same WS connection.
    if ($proto =~ "ws") {
        set_contact_alias();
    }

    # REGISTER (isolated path to avoid impacting INVITE/call routing)
    if (is_method("REGISTER")) {
        route(HANDLE_REGISTER);
        exit;
    }

    # In-dialog requests (ACK/BYE/re-INVITE)
    if (has_totag()) {
        route(WITHIN_DIALOG);
        exit;
    }

    # Handle CANCEL quickly
    if (is_method("CANCEL")) {
        xlog("L_INFO", "CANCEL received for $ru from $si:$sp\n");
        if (t_check_trans()) {
            xlog("L_INFO", "CANCEL: Transaction found, relaying to $du\n");
            t_relay();
        } else {
            xlog("L_WARN", "CANCEL: No matching transaction found\n");
        }
        exit;
    }

    # New INVITE: check if destination is local FIRST (isolated logic)
    if (is_method("INVITE")) {
        # Try to route to locally registered extension or to PBX
        route(HANDLE_INCOMING_INVITE);
        # NOTE: HANDLE_INCOMING_INVITE already calls record_route() for both
        # incoming and outgoing calls, so we DON'T call it again here
    }

    # Subscribe/Refer: still record-route for dialog correctness
    if (is_method("SUBSCRIBE|REFER")) {
        record_route();
    }

    # Relay anything else to PBX
    route(RELAY_TO_PBX);
}

