# ============================================================
# Incoming Call Handling (Isolated)
# Purpose: Handle incoming calls FROM PBX TO WebSocket clients ONLY
# This route should ONLY process calls coming FROM PBX, not FROM WebSocket
# ============================================================

route[HANDLE_INCOMING_INVITE] {
    xlog("L_INFO", "========== HANDLE_INCOMING_INVITE START ==========\n");
    xlog("L_INFO", "[INCOMING] Method=$rm Proto=$proto From=$fu To=$tu Src=$si:$sp\n");
    xlog("L_INFO", "[INCOMING] R-URI=$ru Call-ID=$ci CSeq=$cs\n");
    
    # ============================================================
    # CHECK: Is this FROM WebSocket? If yes, it's OUTGOING, not incoming!
    # ============================================================
    if ($proto =~ "ws|wss") {
        xlog("L_INFO", "[INCOMING] Protocol is WebSocket - this is OUTGOING call, routing to HANDLE_OUTGOING_CALL\n");
        route(HANDLE_OUTGOING_CALL);
        return;
    }
    
    # ============================================================
    # SOURCE IP WHITELIST: Only accept UDP/TCP calls from legitimate PBX
    # Reject spam/unauthorized INVITEs from unknown IPs silently
    # ============================================================
    if (!($si == "85.235.64.159" || $si == "192.168.125.200")) {
        xlog("L_WARN", "[INCOMING] 🚫 REJECTED: Unauthorized source IP $si (not PBX). Returning 403 Forbidden.\n");
        sl_send_reply("403", "Forbidden - Unauthorized Source");
        exit;
    }
    
    # ============================================================
    # NOW we know this is FROM PBX (UDP/TCP) - this is truly INCOMING
    # ============================================================
    xlog("L_INFO", "[INCOMING] ========== INCOMING CALL FROM PBX ==========\n");
    xlog("L_INFO", "[INCOMING] PBX call via $proto: FROM=$fu TO=$tu\n");

    # Convert inbound PBX SDP offer to WebRTC-compatible SDP before relay.
    if (is_method("INVITE") && has_body("application/sdp")) {
        xlog("L_INFO", "[INCOMING] INVITE has SDP from PBX, calling MEDIA_OFFER for PBX->WebRTC conversion\n");
        route(MEDIA_OFFER);
    }
    
    # Extract destination - could be DID or extension
    $var(local_user) = $tU;
    $var(caller) = $fU;
    xlog("L_INFO", "[INCOMING] Caller=$var(caller) → Destination=$var(local_user)@$td\n");
    
    # ============================================================
    # DID-TO-EXTENSION MAPPING
    # If destination looks like a DID (long number starting with prefix),
    # extract the extension from it
    # Format: 360XXXXXXXX → maps to extension 100XXX
    # Example: 36004594505 → 100357
    # ============================================================
    if ($var(local_user) =~ "^[0-9]{6,20}$") {
        xlog("L_INFO", "[INCOMING] Destination looks like DID number, checking for extension mapping\n");

        # Explicit DID map used by your inbound route
        # 360045945057 or 045945057 -> extension 100357
        if ($var(local_user) =~ "^(360)?045945057$") {
            $var(mapped_ext) = "100357";
            $ru = "sip:" + $var(mapped_ext) + "@fusn04.srve.cc";
            xlog("L_INFO", "[INCOMING] METHOD 0 (DID exact map): $var(local_user) -> $var(mapped_ext), R-URI: $ru\n");

            if (lookup("location")) {
                xlog("L_INFO", "[INCOMING] ✅ FOUND via exact DID map! Extension $var(mapped_ext) is registered\n");
                xlog("L_INFO", "[INCOMING] Resolved Contact=$ru Destination=$du\n");

                $avp(is_incoming_to_webrtc) = 1;
                record_route();
                handle_ruri_alias();
                
                # Send 100 Trying manually so transaction doesn't block provisional responses
                send_reply("100", "Trying");
                
                t_on_reply("MANAGE_REPLY");
                t_on_reply("LOCAL_CALL_REPLY");

                if (!t_relay()) {
                    xlog("L_ERR", "[INCOMING] ❌ t_relay() FAILED (DID exact map)\n");
                    sl_reply_error();
                } else {
                    xlog("L_INFO", "[INCOMING] ✅ Successfully relayed to WebRTC client via exact DID map\n");
                }
                exit;
            }
            xlog("L_INFO", "[INCOMING] Exact DID map matched but extension $var(mapped_ext) not found in location\n");
        }
        
        # Check if it starts with 360 (your DID prefix)
        if ($var(local_user) =~ "^360") {
            # Extract digits after 360 prefix as potential extension
            # Example: 36004594505 → 04594505
            xlog("L_INFO", "[INCOMING] DID starts with 360, preparing to extract extension\n");
            
            # For DID 360XXXXXXX, the extension is typically the last 3-5 digits
            # We'll try to find what maps: for now, try the whole number after 360
            if ($var(local_user) =~ "^360([0-9]{3,12})$") {
                # Try mapped_ext = 100 + last 3-5 digits
                # Simple approach: try both 100357 and 100360 for 36004594505
                $var(mapped_ext) = "100357";  # Start with known extension
                $ru = "sip:" + $var(mapped_ext) + "@fusn04.srve.cc";
                xlog("L_INFO", "[INCOMING] METHOD 0 (DID mapping): Trying extension $var(mapped_ext) - R-URI: $ru\n");
                
                if (lookup("location")) {
                    xlog("L_INFO", "[INCOMING] ✅ FOUND via DID mapping! Extension $var(mapped_ext) is registered\n");
                    xlog("L_INFO", "[INCOMING] Resolved Contact=$ru Destination=$du\n");
                    
                    $avp(is_incoming_to_webrtc) = 1;
                    record_route();
                    handle_ruri_alias();
                    
                    # Send 100 Trying manually so transaction doesn't block provisional responses
                    send_reply("100", "Trying");
                    
                    t_on_reply("MANAGE_REPLY");
                    t_on_reply("LOCAL_CALL_REPLY");
                    
                    if (!t_relay()) {
                        xlog("L_ERR", "[INCOMING] ❌ t_relay() FAILED (DID mapping)\n");
                        sl_reply_error();
                    } else {
                        xlog("L_INFO", "[INCOMING] ✅ Successfully relayed to WebRTC client via DID mapping\n");
                    }
                    exit;
                }
                xlog("L_INFO", "[INCOMING] DID mapping failed - extension $var(mapped_ext) not found\n");
            }
        }
    }
    
    # ============================================================
    # FALLBACK: Standard extension lookup (if not DID or mapping failed)
    # ============================================================
    
    # METHOD 1: Try lookup with original Request-URI (PBX domain)
    xlog("L_INFO", "[INCOMING] METHOD 1: Lookup with current R-URI: $ru\n");
    if (lookup("location")) {
        xlog("L_INFO", "[INCOMING] ✅ FOUND via Method 1 (PBX domain)\n");
        xlog("L_INFO", "[INCOMING] Resolved Contact=$ru Destination=$du\n");
        
        $avp(is_incoming_to_webrtc) = 1;
        record_route();
        handle_ruri_alias();
        # CRITICAL: Enable relay of provisional responses (180 Ringing, etc.)
        # Without t_noack(), Kamailio won't relay 180 after sending 100 Trying
        t_on_reply("MANAGE_REPLY");
        t_on_reply("LOCAL_CALL_REPLY");

        if (!t_relay()) {
            xlog("L_ERR", "[INCOMING] ❌ t_relay() FAILED (Method 1)\n");
            sl_reply_error();
        } else {
            xlog("L_INFO", "[INCOMING] ✅ Successfully relayed to WebSocket client\n");
        }
        exit;
    }
    
    xlog("L_INFO", "[INCOMING] Method 1 failed - user not found with PBX domain\n");

    # METHOD 2: Fallback lookup with SBC domain (phone.srve.cc)
    xlog("L_INFO", "[INCOMING] METHOD 2: Fallback lookup with SBC domain\n");
    $ru = "sip:" + $var(local_user) + "@phone.srve.cc";
    xlog("L_INFO", "[INCOMING] Modified R-URI to: $ru\n");

    if (lookup("location")) {
        xlog("L_INFO", "[INCOMING] ✅ FOUND via Method 2 (SBC domain)\n");
        xlog("L_INFO", "[INCOMING] Resolved Contact=$ru Destination=$du\n");
        
        $avp(is_incoming_to_webrtc) = 1;
        record_route();
        handle_ruri_alias();
        # CRITICAL: Enable relay of provisional responses (180 Ringing, etc.)
        t_on_reply("MANAGE_REPLY");
        t_on_reply("LOCAL_CALL_REPLY");
        
        if (!t_relay()) {
            xlog("L_ERR", "[INCOMING] ❌ t_relay() FAILED (Method 2)\n");
            sl_reply_error();
        } else {
            xlog("L_INFO", "[INCOMING] ✅ Successfully relayed to WebSocket client\n");
        }
        exit;
    }
    
    xlog("L_INFO", "[INCOMING] Method 2 failed - user not found with SBC domain\n");

    # METHOD 2B: Fallback lookup with known PBX SIP domain used by extensions
    # Some PBX legs target the SBC IP in R-URI (e.g., sip:100357@38.242.157.239),
    # while registrations are keyed under fusn04.srve.cc.
    xlog("L_INFO", "[INCOMING] METHOD 2B: Fallback lookup with fusn04.srve.cc domain\n");
    $ru = "sip:" + $var(local_user) + "@fusn04.srve.cc";
    xlog("L_INFO", "[INCOMING] Modified R-URI to: $ru\n");

    if (lookup("location")) {
        xlog("L_INFO", "[INCOMING] ✅ FOUND via Method 2B (fusn04 domain)\n");
        xlog("L_INFO", "[INCOMING] Resolved Contact=$ru Destination=$du\n");

        $avp(is_incoming_to_webrtc) = 1;
        record_route();
        handle_ruri_alias();
        # CRITICAL: Enable relay of provisional responses (180 Ringing, etc.)
        t_on_reply("MANAGE_REPLY");
        t_on_reply("LOCAL_CALL_REPLY");

        if (!t_relay()) {
            xlog("L_ERR", "[INCOMING] ❌ t_relay() FAILED (Method 2B)\n");
            sl_reply_error();
        } else {
            xlog("L_INFO", "[INCOMING] ✅ Successfully relayed to WebSocket client\n");
        }
        exit;
    }

    xlog("L_INFO", "[INCOMING] Method 2B failed - user not found with fusn04 domain\n");
    
    # METHOD 3: Try testfusn.srve.cc domain (PBX domain from env)
    $var(pbx_domain) = $env(PBX_IP);
    if ($var(pbx_domain) != $null && $var(pbx_domain) != "") {
        xlog("L_INFO", "[INCOMING] METHOD 3: Lookup with PBX domain from env\n");
        $ru = "sip:" + $var(local_user) + "@" + $var(pbx_domain);
        xlog("L_INFO", "[INCOMING] Modified R-URI to: $ru\n");
        
        if (lookup("location")) {
            xlog("L_INFO", "[INCOMING] ✅ FOUND via Method 3 (env PBX domain)\n");
            xlog("L_INFO", "[INCOMING] Resolved Contact=$ru Destination=$du\n");
            
            $avp(is_incoming_to_webrtc) = 1;
            record_route();
            handle_ruri_alias();
            # CRITICAL: Enable relay of provisional responses (180 Ringing, etc.)
            t_on_reply("MANAGE_REPLY");
            t_on_reply("LOCAL_CALL_REPLY");
            
            if (!t_relay()) {
                xlog("L_ERR", "[INCOMING] ❌ t_relay() FAILED (Method 3)\n");
                sl_reply_error();
            } else {
                xlog("L_INFO", "[INCOMING] ✅ Successfully relayed to WebSocket client\n");
            }
            exit;
        }
        xlog("L_INFO", "[INCOMING] Method 3 failed - user not found with env PBX domain\n");
    }
    
    # User NOT found in location table
    # This means the user is not registered or registration didn't save properly
    xlog("L_WARN", "[INCOMING] ❌ Extension $var(local_user) NOT FOUND in location table\n");
    xlog("L_WARN", "[INCOMING] User may not be registered - sending 480\n");
    
    # Send Temporarily Unavailable
    sl_send_reply("480", "Temporarily Unavailable");
    exit;
}


