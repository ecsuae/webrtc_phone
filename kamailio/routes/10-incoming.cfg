# ============================================================
# Incoming Call Handling (Isolated)
# Differentiate between:
# - Outgoing: INVITE FROM WebSocket client → relay to PBX
# - Incoming: INVITE FROM PBX (UDP/TCP) → route to local client
# ============================================================

route[HANDLE_INCOMING_INVITE] {
    # --- OUTGOING CALLS: FROM WebSocket client ---
    # These are calls originated by the WebRTC client (e.g., 100360 calling external number)
    if ($proto =~ "ws|wss") {
        xlog("L_INFO", "HANDLE_INCOMING_INVITE: OUTGOING call FROM WebSocket client $fu to $tu\n");
        
        # Process media offer for WebRTC SDP
        if (has_body("application/sdp")) {
            xlog("L_INFO", "HANDLE_INCOMING_INVITE: WebSocket INVITE has SDP, processing media offer\n");
            route(MEDIA_OFFER);
        }
        
        # Record-route for dialog continuity
        record_route();
        
        # Mark as WebRTC for media handling
        $avp(is_webrtc) = 1;
        
        # Relay to PBX (handled by main logic below)
        xlog("L_INFO", "HANDLE_INCOMING_INVITE: Relaying WebSocket INVITE to PBX\n");
        return;
    }
    
    # --- INCOMING CALLS: FROM PBX (UDP/TCP) ---
    # These are calls FROM the PBX destined for a local WebSocket client
    xlog("L_INFO", "HANDLE_INCOMING_INVITE: INCOMING call FROM PBX via $proto, FROM=$fu TO=$tu\n");
    
    # For incoming calls, extract destination and check if it's a registered user
    # Extract the destination user from the To header
    $var(local_user) = $tU;  # To header user
    xlog("L_INFO", "HANDLE_INCOMING_INVITE: Checking if local user '$var(local_user)' is registered\n");
    
    # Try to route to locally registered contact
    # In a WebRTC environment, we rely on handle_ruri_alias() to find the WebSocket connection
    # because clients register directly with the PBX, not with the SBC
    if (lookup("location")) {
        xlog("L_INFO", "HANDLE_INCOMING_INVITE: Found $var(local_user) in location table, routing to registered contact\n");
        record_route();
        handle_ruri_alias();
        t_on_reply("MANAGE_REPLY");
        t_on_reply("LOCAL_CALL_REPLY");
        
        if (!t_relay()) {
            xlog("L_ERR", "HANDLE_INCOMING_INVITE: t_relay() FAILED for $var(local_user)\n");
            sl_reply_error();
        }
        exit;
    }
    
    # User NOT found locally in SBC's location table
    # Since clients register with PBX (not SBC), this is expected
    # Relay back to PBX to handle (it will find the registration and route properly)
    xlog("L_INFO", "HANDLE_INCOMING_INVITE: $var(local_user) not in SBC location table, relaying to PBX for routing\n");
    return;
}


