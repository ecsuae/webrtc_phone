# ============================================================
# Incoming Call Handling (Isolated)
# Routes calls to locally registered extensions
# ============================================================

route[HANDLE_INCOMING_INVITE] {
    # Mark WebRTC calls with flag for proper media handling
    if ($proto =~ "ws") {
        $avp(is_webrtc) = 1;
        xlog("L_INFO", "HANDLE_INCOMING_INVITE: INVITE from WebSocket, marking is_webrtc=1\n");
    }

    # Process media offer BEFORE checking if local
    if (has_body("application/sdp")) {
        xlog("L_INFO", "HANDLE_INCOMING_INVITE: Has SDP body, processing media offer\n");
        route(MEDIA_OFFER);
    } else {
        xlog("L_WARN", "HANDLE_INCOMING_INVITE: NO SDP body in INVITE!\n");
    }

    # Check if destination is registered locally (numeric extension)
    # Only numeric extensions can be registered locally (3-9 digits)
    if ($rU =~ "^[0-9]{3,9}$" && lookup("location")) {
        xlog("L_INFO", "HANDLE_INCOMING_INVITE: Found local registration for $rU, routing to registered contact\n");
        
        # Record route for dialog continuity (needed for BYE/re-INVITE)
        record_route();
        
        # Handle WebSocket alias to restore proper WS connection
        handle_ruri_alias();
        
        # Set up reply handlers for SDP bridging
        t_on_reply("MANAGE_REPLY");
        t_on_reply("LOCAL_CALL_REPLY");
        
        # Relay to the registered client
        if (!t_relay()) {
            xlog("L_ERR", "HANDLE_INCOMING_INVITE: t_relay() FAILED for locally registered $rU\n");
            sl_reply_error();
        }
        exit;
    }
    
    # Destination NOT registered locally - return to main logic for PBX relay
    xlog("L_INFO", "HANDLE_INCOMING_INVITE: $rU not registered locally, will relay to PBX\n");
    return;
}

