# ============================================================
# RTPENGINE MEDIA ROUTES
# ============================================================

route[MEDIA_OFFER] {
    xlog("L_INFO", "=== MEDIA_OFFER START ci=$ci method=$rm from $si:$sp proto=$proto is_webrtc=$avp(is_webrtc) is_local=$avp(is_local_call) ===\n");
    xlog("L_INFO", "MEDIA_OFFER: ci=$ci request body length=$ml bytes\n");
    if (has_body("application/sdp")) {
        if ($rb =~ "a=rtpmap:73" || $rb =~ "a=fmtp:73" || $rb =~ "m=audio .* 73( |$)") {
            xlog("L_WARN", "MEDIA_OFFER: ci=$ci SDP CONTAINS PT=73 marker (rtpmap/fmtp/m-line)\n");
        }
    }

    # For ext-to-ext calls (both WebRTC), bridge two DTLS/SRTP streams
    if ($avp(is_local_call) == 1) {
        xlog("L_INFO", "MEDIA_OFFER: ext-to-ext WebRTC call (DTLS bridging)\n");
        # ICE=force: RTPEngine acts as ICE endpoint
        # DTLS=passive: RTPEngine accepts DTLS connection from caller
        # asymmetric: allow one-way media if needed
        # media-address=PUBLIC_IP: ensure reachable media address
        if (rtpengine_offer("replace-origin replace-session-connection asymmetric ICE=force DTLS=passive media-address=" + $env(KAM_PUBLIC_IP))) {
            xlog("L_INFO", "rtpengine_offer() SUCCESS (ext-to-ext)\n");
        } else {
            xlog("L_ERR", "rtpengine_offer() FAILED!\n");
        }
    } else if ($proto =~ "ws|wss") {
        # OUTGOING: WebRTC browser -> PBX
        # Convert browser offer (SRTP/ICE/DTLS) to plain RTP for PBX.
        xlog("L_INFO", "MEDIA_OFFER: WebRTC-to-PBX offer conversion\n");
        if (rtpengine_offer("RTP/AVP replace-origin replace-session-connection ICE=remove DTLS=off")) {
            xlog("L_INFO", "rtpengine_offer() SUCCESS (webrtc->pbx)\n");
        } else {
            xlog("L_ERR", "rtpengine_offer() FAILED (webrtc->pbx)!\n");
        }
    } else {
        # INCOMING: PBX -> WebRTC browser
        # Convert PBX offer (RTP/AVP) to WebRTC-compatible SDP (SAVPF/ICE/DTLS).
        # CRITICAL: Must include rtcp-mux, DTLS fingerprints, and proper codec filtering
        xlog("L_INFO", "MEDIA_OFFER: PBX-to-WebRTC offer conversion\n");
        # Note: RTPEngine already advertises the correct public IP via --interface=eth0!PUBLIC_IP.
        # Do NOT add media-address here — it caused asymmetric audio on Wi-Fi.
        if (rtpengine_offer("RTP/SAVPF replace-origin replace-session-connection ICE=force DTLS=passive rtcp-mux=offer codec-mask=PCMA codec-mask=PCMU")) {
            xlog("L_INFO", "rtpengine_offer() SUCCESS (pbx->webrtc)\n");
        } else {
            xlog("L_ERR", "rtpengine_offer() FAILED (pbx->webrtc)!\n");
        }
    }

    return;
}

route[MEDIA_ANSWER] {
    xlog("L_INFO", "=== MEDIA_ANSWER START ci=$ci method=$rm status=$rs from $si:$sp proto=$proto is_webrtc=$avp(is_webrtc) is_local=$avp(is_local_call) ===\n");
    xlog("L_INFO", "MEDIA_ANSWER: ci=$ci response code=$rs, body_length=$ml\n");
    if (has_body("application/sdp")) {
        if ($rb =~ "a=rtpmap:73" || $rb =~ "a=fmtp:73" || $rb =~ "m=audio .* 73( |$)") {
            xlog("L_WARN", "MEDIA_ANSWER: ci=$ci SDP CONTAINS PT=73 marker (rtpmap/fmtp/m-line)\n");
        }
    }

    # For ext-to-ext calls (both WebRTC), bridge two DTLS/SRTP streams
    if ($avp(is_local_call) == 1) {
        xlog("L_INFO", "MEDIA_ANSWER: ext-to-ext WebRTC call (DTLS bridging)\n");
        # ICE=force: RTPEngine acts as ICE endpoint
        # DTLS=passive: RTPEngine accepts DTLS connection from callee
        # asymmetric: allow one-way media if needed
        # media-address=PUBLIC_IP: ensure reachable media address
        if (rtpengine_answer("replace-origin replace-session-connection asymmetric ICE=force DTLS=passive media-address=" + $env(KAM_PUBLIC_IP))) {
            xlog("L_INFO", "rtpengine_answer() SUCCESS (ext-to-ext)\n");
        } else {
            xlog("L_ERR", "rtpengine_answer() FAILED!\n");
        }
    } else if ($proto =~ "ws|wss") {
        # INCOMING call answer path: browser -> PBX
        # Convert browser 200 OK (WebRTC SDP) back to plain RTP for PBX.
        xlog("L_INFO", "MEDIA_ANSWER: WebRTC-to-PBX answer conversion\n");
        if (rtpengine_answer("RTP/AVP replace-origin replace-session-connection ICE=remove DTLS=off")) {
            xlog("L_INFO", "rtpengine_answer() SUCCESS (webrtc->pbx)\n");
        } else {
            xlog("L_ERR", "rtpengine_answer() FAILED (webrtc->pbx)!\n");
        }
    } else {
        # OUTGOING call answer path: PBX -> browser (including early media 180/183 with SDP)
        # Convert PBX answer (RTP/AVP) to WebRTC-compatible SDP (SAVPF/ICE/DTLS).
        # WARNING: Do NOT add rtcp-mux=answer or codec-mask here.
        # The OFFER path (ICE=remove) does not set explicit rtcp-mux state.
        # Adding rtcp-mux=answer in ANSWER causes asymmetric audio (one-sided) on Wi-Fi.
        # This was confirmed broken and reverted 2026-03-29. See docs/05.
        # Note: RTPEngine already advertises the correct public IP via --interface=eth0!PUBLIC_IP.
        # Do NOT add media-address here — also caused asymmetric audio on Wi-Fi.
        xlog("L_INFO", "MEDIA_ANSWER: PBX-to-WebRTC answer conversion (outgoing call)\n");
        if (rtpengine_answer("RTP/SAVPF replace-origin replace-session-connection ICE=force DTLS=passive")) {
            xlog("L_INFO", "rtpengine_answer() SUCCESS (pbx->webrtc)\n");
        } else {
            xlog("L_ERR", "rtpengine_answer() FAILED (pbx->webrtc)!\n");
        }
    }

    return;
}

route[MEDIA_DELETE] {
    xlog("L_INFO", "MEDIA_DELETE rtpengine_delete()\n");
    rtpengine_delete();
    return;
}
