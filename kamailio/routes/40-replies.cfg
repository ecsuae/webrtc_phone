# ------------------------------------------------------------
# Reply route (handles 200 OK SDP, etc.)
# ------------------------------------------------------------
onreply_route[MANAGE_REPLY] {
    xlog("L_WARN", "=== MANAGE_REPLY ENTERED: status=$rs from $si:$sp proto=$proto method=$rm CSeq=$cs ===\n");
    xlog("L_WARN", "    To: $tu From: $fu Call-ID: $ci\n");

    # Keep WS aliasing stable for replies too
    if ($proto =~ "ws") {
        xlog("L_INFO", "MANAGE_REPLY: Response from WebSocket, setting contact alias\n");
        set_contact_alias();
    }

    # REGISTRATION REPLY: PBX accepted with 200 OK
    # Sync WebSocket registration/unregistration with Kamailio location table
    if (is_method("REGISTER") && status =~ "2[0-9][0-9]" && isflagset(10)) {
        xlog("L_INFO", "MANAGE_REPLY: PBX accepted WebSocket REGISTER for $tu\n");
        
        # CRITICAL: Restore original Contact header for SIP.js validation
        # SIP.js expects to see its own Contact echoed back, not the rewritten one
        # We stored the original Contact in $avp(original_contact) before sending to PBX
        if ($avp(original_contact) != $null) {
            xlog("L_INFO", "MANAGE_REPLY: Restoring original Contact for client validation\n");
            xlog("L_INFO", "  PBX returned: $hdr(Contact)\n");
            xlog("L_INFO", "  Restoring to: $avp(original_contact)\n");
            
            # Remove all Contact headers that PBX added (may have multiple)
            remove_hf("Contact");
            
            # Add back the original Contact that the client sent
            append_hf("Contact: $avp(original_contact)\r\n");
        }

        if (is_present_hf("Contact")) {
            $var(contact_hdr) = $hdr(Contact);
            if ($var(contact_hdr) =~ "expires=0" || $var(contact_hdr) == "*") {
                xlog("L_INFO", "MANAGE_REPLY: Unregistration detected - removing $tu from location\n");
                if (!unregister("location", "$tu")) {
                    xlog("L_WARN", "MANAGE_REPLY: unregister(location,$tu) returned false\n");
                }
                
                # Clean up WebSocket connection tracking htable (use source IP:port as key)
                if ($proto =~ "ws|wss") {
                    $var(ws_key) = $si + ":" + $sp;
                    xlog("L_INFO", "MANAGE_REPLY: Cleaning up wsconn[$var(ws_key)] after explicit unregister\n");
                    $sht(wsconn=>$var(ws_key)) = $null;
                }
            } else {
                xlog("L_INFO", "MANAGE_REPLY: Saving WebSocket registration to location\n");
                if (!save("location", "0x01")) {
                    xlog("L_ERR", "MANAGE_REPLY: save(location) failed for $tu\n");
                }
            }
        } else {
            xlog("L_INFO", "MANAGE_REPLY: No Contact on 200 REGISTER - removing $tu from location\n");
            if (!unregister("location", "$tu")) {
                xlog("L_WARN", "MANAGE_REPLY: unregister(location,$tu) returned false\n");
            }
            
            # Clean up WebSocket connection tracking htable (use source IP:port as key)
            if ($proto =~ "ws|wss") {
                $var(ws_key) = $si + ":" + $sp;
                xlog("L_INFO", "MANAGE_REPLY: Cleaning up wsconn[$var(ws_key)] after no-contact unregister\n");
                $sht(wsconn=>$var(ws_key)) = $null;
            }
        }
    }

    # When PBX replies with SDP (e.g., 183/200), bridge with rtpengine_answer
    if (status=~"18[0-9]|2[0-9][0-9]") {
        xlog("L_INFO", "MANAGE_REPLY: provisional or success response, checking for SDP\n");
        if (has_body("application/sdp")) {
            xlog("L_INFO", "MANAGE_REPLY: SDP found, calling MEDIA_ANSWER\n");
            route(MEDIA_ANSWER);
        } else {
            xlog("L_WARN", "MANAGE_REPLY: Response but NO SDP body detected\n");
        }
    }

    # NOTE: In onreply_route, responses are automatically relayed upstream
    # unless explicitly dropped. Do not use drop() or exit here.
    # Just let the route complete naturally to relay the response.
}

# ============================================================
# Local Call Reply Route (for ext-to-ext calls)
# ============================================================
onreply_route[LOCAL_CALL_REPLY] {
    xlog("L_WARN", "LOCAL_CALL_REPLY: reply status=$rs from $si:$sp proto=$proto\n");

    # Ensure WebSocket alias is properly restored for replies
    if ($proto =~ "ws") {
        xlog("L_INFO", "LOCAL_CALL_REPLY: Restoring WebSocket alias for ext-to-ext reply\n");
        set_contact_alias();
    }

    # Handle early media (180 Ringing with SDP) for ext-to-ext calls
    # This allows the calling browser to hear ringtone from called browser
    if (status =~ "18[0-9]" && has_body("application/sdp")) {
        xlog("L_INFO", "LOCAL_CALL_REPLY: Early media detected (180 with SDP), calling MEDIA_ANSWER for ext-to-ext\n");
        route(MEDIA_ANSWER);
    }

    # When called extension replies with answer SDP (200 OK), process media answer
    if (status=~"2[0-9][0-9]" && has_body("application/sdp")) {
        xlog("L_INFO", "LOCAL_CALL_REPLY: 200 OK with SDP, calling MEDIA_ANSWER for ext-to-ext\n");
        route(MEDIA_ANSWER);
    }

    # Log provisional responses
    if (status =~ "18[0-9]") {
        xlog("L_INFO", "LOCAL_CALL_REPLY: Provisional response (180 Ringing) - will be relayed via Record-Route\n");
    }

    # CRITICAL: Allow responses to be relayed back via Record-Route
    # Do NOT exit here - let the response flow back naturally
    # This is essential for 180 Ringing to reach the PBX/dialer
}
