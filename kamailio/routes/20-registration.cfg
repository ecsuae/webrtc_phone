# ------------------------------------------------------------
# NAT register fixes
# ------------------------------------------------------------
route[FIX_NAT_REGISTER] {

    # If SIP.js behind NAT: fix contact and ensure alias.
    # (set_contact_alias already done for $proto =~ "ws")
    if (nat_uac_test("19")) {
        fix_nated_register();
    }
    return;
}


# ------------------------------------------------------------
# Dedicated REGISTER handling (kept isolated from call relay)
# Supports both PBX registration (relay) and SBC registration (local/location)
# STRATEGY:
# - WebSocket (SIP.js) clients: Save locally + async relay to PBX
# - Other clients: Relay to PBX normally
# ------------------------------------------------------------
route[HANDLE_REGISTER] {
    route(FIX_NAT_REGISTER);

    # Mark WebSocket registrations so reply-route can sync local usrloc
    if ($proto =~ "ws|wss") {
        setflag(10);
        xlog("L_INFO", "HANDLE_REGISTER: WebSocket registration detected for $tu from $si:$sp\n");
        
        # Track WebSocket by source IP:port -> AOR mapping for cleanup on disconnect
        # This allows us to send unregister to PBX when browser closes
        $var(ws_key) = $si + ":" + $sp;
        $sht(wsconn=>$var(ws_key)) = $tu;
        xlog("L_INFO", "HANDLE_REGISTER: Stored wsconn[$var(ws_key)] = $tu\n");
        
        # DO NOT add Path/received for WebSocket - it will contain 127.0.0.1
        # and PBX will try to route back to localhost instead of Kamailio
    } else {
        # Only add Path with received parameter for non-WebSocket clients
        # So PBX can route back to traditional SIP clients correctly
        add_path_received();
    }

    # Relay REGISTER to PBX; MANAGE_REPLY will process 200 OK
    route(RELAY_REGISTER_TO_PBX);
    exit;
}


# ------------------------------------------------------------
# REGISTER-only relay to PBX (separate from INVITE relay)
route[RELAY_REGISTER_TO_PBX] {
    xlog("L_INFO", "RELAY_REGISTER_TO_PBX: Forwarding REGISTER to PBX (Contact: $hdr(Contact))\n");
        # ============================================================
    # CRITICAL FIX: Rewrite Contact for WebSocket registrations
    # Problem: WebRTC client sends Contact with 127.0.0.1 (non-routable)
    # When PBX receives REGISTER, it stores this non-routable contact
    # When PBX tries to bridge inbound calls to user/100357, it looks up
    # the extension and finds Contact=127.0.0.1, fails with 503
    # 
    # Solution: Rewrite Contact to point to Kamailio's external IP
    # from env `KAM_PUBLIC_IP` so PBX can route inbound calls back through Kamailio
    # ============================================================
    if ($proto =~ "ws|wss" && ($hdr(Contact) =~ "127\.0\.0\.1" || $hdr(Contact) =~ "\.invalid")) {
        xlog("L_INFO", "RELAY_REGISTER_TO_PBX: 🔧 Rewriting Contact from non-routable address to Kamailio IP\n");
        xlog("L_INFO", "  Original Contact: $hdr(Contact)\n");
        
        # CRITICAL: Store original Contact so we can restore it in the 200 OK reply
        # SIP.js expects to see its own Contact echoed back, not the rewritten one
        $avp(original_contact) = $hdr(Contact);
        
        # Remove the problematic Contact and build a new one
        # pointing to Kamailio's external IP where it will accept and route the INVITE
        remove_hf("Contact");
        
        # Build Contact: <sip:extension@KAM_PUBLIC_IP>;expires=600
        # Use $tU (TO URI user, e.g., 100357) to maintain extension identity
        # NOTE: DO NOT add ;transport=ws here! PBX needs standard UDP/TCP contact.
        # Kamailio handles WebSocket routing internally via contact alias mechanism.
        append_hf("Contact: <sip:$tU@$env(KAM_PUBLIC_IP)>;expires=600\r\n");
        
        xlog("L_INFO", "  Rewritten Contact for PBX: <sip:$tU@$env(KAM_PUBLIC_IP)>;expires=600\n");
    }
        # Domain-to-PBX mapping
    route(GET_PBX_FOR_DOMAIN);

    if ($avp(pbx_host) == $null || $avp(pbx_host) == "") {
        xlog("L_ERR", "RELAY_REGISTER_TO_PBX: Failed to determine PBX host\n");
        # Don't return error to client - they already got 200 OK
        return;
    }

    $var(pbx_port) = $env(PBX_PORT);
    if ($var(pbx_port) == $null || $var(pbx_port) == "") {
        $var(pbx_port) = "5060";
    }

    $var(pbx_transport) = $env(PBX_TRANSPORT);
    if ($var(pbx_transport) == $null || $var(pbx_transport) == "") {
        $var(pbx_transport) = "udp";
    }

    $du = "sip:" + $avp(pbx_host) + ":" + $var(pbx_port) + ";transport=" + $var(pbx_transport);
    xlog("L_INFO", "RELAY_REGISTER_TO_PBX: Relaying REGISTER to PBX at $du\n");

    # Always relay transactionally and let reply-route process response
    t_on_reply("MANAGE_REPLY");
    route(RELAY);
    exit;
}


# -----------------------------------------------------------
# Store registration locally in SBC location table
# This enables incoming call routing via lookup("location")
# -----------------------------------------------------------
route[SAVE_SBC_REGISTRATION] {
    # Remove loose routing
    remove_hf_re("^Route:");

    # Save contact in location table
    # The contact will have ;alias or transport info that helps route back via WS
    if (save("location")) {
        xlog("L_INFO", "SAVE_SBC_REGISTRATION: Saved $tu -> $hdr(Contact) in location\n");
        sl_send_reply("200", "OK");
        exit;
    } else {
        xlog("L_ERR", "SAVE_SBC_REGISTRATION: Failed to save $tu\n");
        sl_send_reply("500", "Server Error");
        exit;
    }
}


# -----------------------------------------------------------
# Send UNREGISTER to PBX when WebSocket closes
# Called from event_route[websocket:closed]
# $var(aor) must be set to the AOR to unregister (e.g., sip:100357@fusn04.srve.cc)
# -----------------------------------------------------------
route[SEND_UNREGISTER_TO_PBX] {
    # Extract domain from AOR
    $var(aor_domain) = $(var(aor){uri.host});
    $var(aor_user) = $(var(aor){uri.user});
    
    xlog("L_INFO", "SEND_UNREGISTER_TO_PBX: Unregistering $var(aor) from PBX\n");
    
    # Get PBX host for this domain using the same env-driven mapping used elsewhere.
    $avp(req_domain) = $var(aor_domain);
    $rd = $var(aor_domain);
    route(GET_PBX_FOR_DOMAIN);
    $var(pbx_host) = $avp(pbx_host);
    if ($var(pbx_host) == $null || $var(pbx_host) == "") {
        $var(pbx_host) = $env(PBX_IP);
    }
    
    $var(pbx_port) = $env(PBX_PORT);
    if ($var(pbx_port) == $null || $var(pbx_port) == "") {
        $var(pbx_port) = "5060";
    }
    
    # Build PBX URI
    $var(pbx_uri) = "sip:" + $var(pbx_host) + ":" + $var(pbx_port);
    
    # Send REGISTER with Contact: * and Expires: 0 to unregister
    # UAC module will construct the proper REGISTER request
    $uac_req(method) = "REGISTER";
    $uac_req(ruri) = $var(pbx_uri);
    $uac_req(furi) = $var(aor);
    $uac_req(turi) = $var(aor);
    $uac_req(hdrs) = "Contact: *\r\nExpires: 0\r\n";
    
    xlog("L_INFO", "SEND_UNREGISTER_TO_PBX: Sending unregister to $var(pbx_uri) for $var(aor)\n");
    
    if (uac_req_send()) {
        xlog("L_INFO", "SEND_UNREGISTER_TO_PBX: Successfully sent unregister for $var(aor)\n");
    } else {
        xlog("L_ERR", "SEND_UNREGISTER_TO_PBX: Failed to send unregister for $var(aor)\n");
    }
}

