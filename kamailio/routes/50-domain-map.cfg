# ============================================================
# Domain-to-PBX Mapping for Multi-Tenant Support
# ============================================================
route[GET_PBX_FOR_DOMAIN] {
    # Map domain to PBX host based on request URI domain
    # Extract the host part from Request-URI
    $avp(req_domain) = $rd;  # Request-URI domain
    
    xlog("L_INFO", "GET_PBX_FOR_DOMAIN: Processing domain $avp(req_domain) (ruri=$ru)\n");
    
    # Default: use PBX_IP from environment
    $avp(pbx_host) = $env(PBX_IP);

    # Optional: explicit domain -> PBX host mappings from .env (up to 8 entries)
    if ($env(PBX_MAP_1_DOMAIN) != $null && $env(PBX_MAP_1_DOMAIN) != "" && $avp(req_domain) == $env(PBX_MAP_1_DOMAIN)) $avp(pbx_host) = $env(PBX_MAP_1_HOST);
    else if ($env(PBX_MAP_2_DOMAIN) != $null && $env(PBX_MAP_2_DOMAIN) != "" && $avp(req_domain) == $env(PBX_MAP_2_DOMAIN)) $avp(pbx_host) = $env(PBX_MAP_2_HOST);
    else if ($env(PBX_MAP_3_DOMAIN) != $null && $env(PBX_MAP_3_DOMAIN) != "" && $avp(req_domain) == $env(PBX_MAP_3_DOMAIN)) $avp(pbx_host) = $env(PBX_MAP_3_HOST);
    else if ($env(PBX_MAP_4_DOMAIN) != $null && $env(PBX_MAP_4_DOMAIN) != "" && $avp(req_domain) == $env(PBX_MAP_4_DOMAIN)) $avp(pbx_host) = $env(PBX_MAP_4_HOST);
    else if ($env(PBX_MAP_5_DOMAIN) != $null && $env(PBX_MAP_5_DOMAIN) != "" && $avp(req_domain) == $env(PBX_MAP_5_DOMAIN)) $avp(pbx_host) = $env(PBX_MAP_5_HOST);
    else if ($env(PBX_MAP_6_DOMAIN) != $null && $env(PBX_MAP_6_DOMAIN) != "" && $avp(req_domain) == $env(PBX_MAP_6_DOMAIN)) $avp(pbx_host) = $env(PBX_MAP_6_HOST);
    else if ($env(PBX_MAP_7_DOMAIN) != $null && $env(PBX_MAP_7_DOMAIN) != "" && $avp(req_domain) == $env(PBX_MAP_7_DOMAIN)) $avp(pbx_host) = $env(PBX_MAP_7_HOST);
    else if ($env(PBX_MAP_8_DOMAIN) != $null && $env(PBX_MAP_8_DOMAIN) != "" && $avp(req_domain) == $env(PBX_MAP_8_DOMAIN)) $avp(pbx_host) = $env(PBX_MAP_8_HOST);
    
    xlog("L_INFO", "GET_PBX_FOR_DOMAIN: Final resolution $avp(req_domain) -> $avp(pbx_host)\n");
}
