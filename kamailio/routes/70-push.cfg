# ============================================================
# SEND_PUSH_NOTIFICATION
# Triggers push notification to wake up mobile device
# Called when user is not registered (lookup fails)
# ============================================================
route[SEND_PUSH_NOTIFICATION] {
    xlog("L_INFO", "[PUSH] Triggering push notification for extension: $var(target_ext), caller: $fU, Call-ID: $ci\n");
    
    # Build JSON payload for push notification
    $var(push_json) = '{"extension":"' + $var(target_ext) + '","from":"' + $fU + '","callId":"' + $ci + '"}';
    
    # Execute curl in background to avoid blocking the SIP transaction.
    # Use 127.0.0.1 since push-server is on same host.
    # NOTE: exec module on this image does not provide exec_bg().
    $var(push_cmd) = "curl -s -X POST http://127.0.0.1:3001/api/push/notify " +
                     "-H Content-Type:application/json " +
                     "-d '" + $var(push_json) + "' >/dev/null 2>&1 &";

    if (exec("$var(push_cmd)")) {
        xlog("L_INFO", "[PUSH] Push notification triggered successfully\n");
    } else {
        xlog("L_WARN", "[PUSH] Failed to trigger push notification command\n");
    }
}
