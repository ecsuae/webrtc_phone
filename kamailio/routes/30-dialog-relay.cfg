# ------------------------------------------------------------
# In-dialog routing
# ------------------------------------------------------------
route[WITHIN_DIALOG] {

    if (loose_route()) {
        xlog("L_INFO", "WITHIN_DIALOG: loose_route matched for $rm\n");
        
        # If ACK includes SDP, finalize media answer
        if (is_method("ACK") && has_body("application/sdp")) {
            xlog("L_INFO", "WITHIN_DIALOG: ACK with SDP (may be ext-to-ext)\n");
            route(MEDIA_ANSWER);
        }

        # BYE: delete rtpengine session
        if (is_method("BYE")) {
            xlog("L_INFO", "WITHIN_DIALOG: BYE received - cleaning up RTP session\n");
            route(MEDIA_DELETE);
        }

        # Keep WS alias for all in-dialog frames
        if ($proto =~ "ws") {
            set_contact_alias();
        }

        route(RELAY);
        exit;
    }
    
    # If loose_route failed, try to restore WebSocket alias for BYE/ACK coming from PBX
    # This handles cases where the PBX BYE arrives without proper Route headers
    handle_ruri_alias();
    
    # Check if we have a resolved destination (from alias or pre-existing $du)
    if ($du != $null && $du != "" && is_method("BYE|ACK|INFO|UPDATE|NOTIFY|PRACK|MESSAGE|REFER")) {
        xlog("L_INFO", "WITHIN_DIALOG fallback: alias/du resolved for $rm to $du\n");
        
        # Ensure WS alias is maintained even in fallback path
        if ($proto =~ "ws") {
            set_contact_alias();
        }
        
        # For BYE, cleanup RTPEngine session
        if (is_method("BYE")) {
            route(MEDIA_DELETE);
        }
        
        route(RELAY);
        exit;
    }

    # No loose_route and no alias => not for us
    xlog("L_WARN", "WITHIN_DIALOG: No route found for $rm, sending 404\n");
    sl_send_reply("404", "Not Here");
    exit;
}


# ------------------------------------------------------------
# Relay to PBX helper (centralized)
# ------------------------------------------------------------
route[RELAY_TO_PBX] {
    # Call the domain-to-PBX mapping route
    route(GET_PBX_FOR_DOMAIN);
    
    # PBX host should now be set in $avp(pbx_host)
    if ($avp(pbx_host) == $null || $avp(pbx_host) == "") {
        xlog("L_ERR", "RELAY_TO_PBX: Failed to determine PBX host; cannot relay\n");
        sl_send_reply("503", "Server Error");
        exit;
    }

    # PBX port: default 5060 when not provided
    $var(pbx_port) = $env(PBX_PORT);
    if ($var(pbx_port) == $null || $var(pbx_port) == "") {
        $var(pbx_port) = "5060";
    }

    # Transport: default udp
    $var(pbx_transport) = $env(PBX_TRANSPORT);
    if ($var(pbx_transport) == $null || $var(pbx_transport) == "") {
        $var(pbx_transport) = "udp";
    }

    xlog("L_INFO", "RELAY_TO_PBX via $var(pbx_transport) to $avp(pbx_host):$var(pbx_port) from $si:$sp | Method: $rm, Request-URI: $ru, From: $fu, To: $tu\n");

    # Send everything to FusionPBX (registrations and calls)
    $du = "sip:" + $avp(pbx_host) + ":" + $var(pbx_port) + ";transport=" + $var(pbx_transport);

    # Let us touch replies (useful for SDP answer)
    t_on_reply("MANAGE_REPLY");

    route(RELAY);
    exit;
}


# ------------------------------------------------------------
# Actual relay
# ------------------------------------------------------------
route[RELAY] {
    # Last-minute check: ensure Supported: 100rel is present before relay
    if (is_method("INVITE")) {
        if (is_present_hf("Supported")) {
            if (!($hdr(Supported) =~ "100rel")) {
                append_hf("Supported: 100rel\r\n");
                xlog("L_INFO", "RELAY: Final append of 100rel to Supported header before t_relay\n");
            }
        } else {
            append_hf("Supported: 100rel\r\n");
            xlog("L_INFO", "RELAY: Final addition of Supported: 100rel before t_relay\n");
        }
    }

    # Required for stateful forwarding
    if (!t_relay()) {
        xlog("L_ERR", "RELAY: t_relay() FAILED for $rm to $du\n");
        sl_reply_error();
    }
    exit;
}
