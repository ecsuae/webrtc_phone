# ============================================================
# OUTGOING CALL HANDLER (Isolated)
# Purpose: Handle outgoing calls FROM WebSocket clients TO PBX
# This is completely isolated from incoming call logic
# ============================================================

route[HANDLE_OUTGOING_CALL] {
    xlog("L_INFO", "===== OUTGOING CALL HANDLER START =====\n");
    xlog("L_INFO", "[OUTGOING] Method=$rm Proto=$proto From=$fu To=$tu\n");
    xlog("L_INFO", "[OUTGOING] WebSocket client calling: $fu → $tu\n");

    # Force all outgoing calls (including extension-to-extension) through PBX.
    # This allows PBX-controlled ringback/early-media behavior instead of local bypass.
    if ($rU =~ "^[0-9]{3,6}$") {
        xlog("L_INFO", "[OUTGOING] Extension destination detected ($rU) - forcing PBX route for early-media/ringback\n");
    }

    # Non-local destination: normal WebRTC -> PBX flow.
    $avp(is_webrtc) = 1;
    $avp(is_outgoing_call) = 1;

    # CRITICAL: Ensure Supported: 100rel reaches FreeSWITCH BEFORE processing media
    # This must happen early so the header survives through routing
    if (is_present_hf("Supported")) {
        if (!($hdr(Supported) =~ "100rel")) {
            append_hf("Supported: 100rel\r\n");
            xlog("L_INFO", "[OUTGOING] Appended 100rel to existing Supported header\n");
        } else {
            xlog("L_INFO", "[OUTGOING] Supported header already contains 100rel\n");
        }
    } else {
        append_hf("Supported: 100rel\r\n");
        xlog("L_INFO", "[OUTGOING] Added Supported: 100rel header\n");
    }

    if (has_body("application/sdp")) {
        xlog("L_INFO", "[OUTGOING] INVITE has SDP, calling MEDIA_OFFER (webrtc->pbx)\n");
        route(MEDIA_OFFER);
    } else {
        xlog("L_WARN", "[OUTGOING] INVITE without SDP\n");
    }
    
    # Record-route for proper dialog management
    record_route();
    
    xlog("L_INFO", "[OUTGOING] Routing call to PBX via RELAY_TO_PBX\n");
    
    # Return to main route which will call RELAY_TO_PBX
    return;
}
