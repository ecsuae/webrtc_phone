# ============================================================
# OUTGOING CALL HANDLER (Isolated)
# Purpose: Handle outgoing calls FROM WebSocket clients TO PBX
# This is completely isolated from incoming call logic
# ============================================================

route[HANDLE_OUTGOING_CALL] {
    xlog("L_INFO", "===== OUTGOING CALL HANDLER START =====\n");
    xlog("L_INFO", "[OUTGOING] Method=$rm Proto=$proto From=$fu To=$tu\n");
    xlog("L_INFO", "[OUTGOING] WebSocket client calling: $fu → $tu\n");

    # Check if destination is a local extension (for ext-to-ext calls)
    if ($rU =~ "^[0-9]{3,6}$") {
        xlog("L_INFO", "[OUTGOING] Destination $rU looks like extension, checking local registration\n");
        
        if (lookup("location")) {
            xlog("L_INFO", "[OUTGOING] ✅ Local extension $rU FOUND, routing directly (ext-to-ext)\n");
            xlog("L_INFO", "[OUTGOING] Contact=$ru Destination=$du\n");

            # Mark local WebRTC-to-WebRTC path BEFORE media conversion.
            # This ensures MEDIA_OFFER uses DTLS/SRTP bridging instead of RTP/AVP stripping.
            $avp(is_local_call) = 1;
            $avp(is_outgoing_call) = 1;

            if (has_body("application/sdp")) {
                xlog("L_INFO", "[OUTGOING] Local ext-to-ext INVITE has SDP, calling MEDIA_OFFER (local mode)\n");
                route(MEDIA_OFFER);
            } else {
                xlog("L_WARN", "[OUTGOING] Local ext-to-ext INVITE without SDP\n");
            }
            
            record_route();
            handle_ruri_alias();
            t_on_reply("MANAGE_REPLY");
            t_on_reply("LOCAL_CALL_REPLY");

            if (!t_relay()) {
                xlog("L_ERR", "[OUTGOING] ❌ t_relay() FAILED for local extension $rU\n");
                sl_reply_error();
            } else {
                xlog("L_INFO", "[OUTGOING] ✅ Successfully relayed to local extension\n");
            }
            exit;
        }
        
        xlog("L_INFO", "[OUTGOING] Local extension $rU not found, routing to PBX\n");
    }

    # Non-local destination: normal WebRTC -> PBX flow.
    $avp(is_webrtc) = 1;
    $avp(is_outgoing_call) = 1;

    if (has_body("application/sdp")) {
        xlog("L_INFO", "[OUTGOING] INVITE has SDP, calling MEDIA_OFFER (webrtc->pbx)\n");
        route(MEDIA_OFFER);
    } else {
        xlog("L_WARN", "[OUTGOING] INVITE without SDP\n");
    }
    
    # Record-route for proper dialog management
    record_route();
    
    xlog("L_INFO", "[OUTGOING] Routing call to PBX via RELAY_TO_PBX\n");
    
    # Return to main route which will call RELAY_TO_PBX
    return;
}
