server {
  listen 80;
  server_name phone.srve.cc;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name phone.srve.cc;

  ssl_certificate /certs/fullchain.pem;
  ssl_certificate_key /certs/privkey.pem;

  root /var/www/phone;
  index index.html;

  location = /ws {
    # Kamailio is in host network mode, reach via localhost
    proxy_pass http://127.0.0.1:8443;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # IMPORTANT for Kamailio SIP-over-WS
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

    proxy_buffering off;
    proxy_request_buffering off;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 5s;
  }

  location /api/push/ {
    # Push notification server
    proxy_pass http://127.0.0.1:3001/api/push/;
    
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_buffering off;
  }

  location /api/logs/ {
    # Mobile logs API
    proxy_pass http://127.0.0.1:3001/api/logs/;
    
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_buffering off;
  }

  location /dashboard {
    allow 127.0.0.1;
    allow 10.252.253.0/24;
    deny all;

    proxy_pass http://127.0.0.1:3001/dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}

# WireGuard-only admin endpoint for device dashboard and log management
server {
  listen 10.252.253.15:8081;
  server_name _;

  location /dashboard {
    proxy_pass http://127.0.0.1:3001/dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location /src/dashboard/ {
    proxy_pass http://127.0.0.1:3001/src/dashboard/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location /api/logs/mobile {
    proxy_pass http://127.0.0.1:3001/api/logs/mobile;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location /api/logs/mobile/ {
    proxy_pass http://127.0.0.1:3001/api/logs/mobile/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location / {
    return 404;
  }
}
